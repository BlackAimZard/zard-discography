<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu</title>
<style type="text/css">
/* BASE RESET */
body, h2, ul, li { margin: 0; padding: 0; outline: 0; }
ul { list-style: none; }

/* GLOBAL FONT & BACKGROUND */
body { background: #000; min-height: 100vh; font-size: 16px; font-family: "Times New Roman", sans-serif; }
html, body { overscroll-behavior: none; margin: 0; padding: 0; }

/* ELEMENT & ICON */
a { text-decoration: none; color: #000000; }
a:hover { color: red; text-decoration: none; }
details a { color: blue; }
li { margin: 20px 0 20px 10px; }

/* VERTICAL MENU STYLE */
body > ul {
    display: flex;
    flex-direction: column;
    padding-top: 50px;
}
body > ul > li {
    margin: 0;
}
body > ul > li > a {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding-left: 10px;
    width: 100%;
    height: 80px;
    background: transparent;
    color: #FFF;
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 15px;
    font-weight: bold;
    text-transform: uppercase;
    box-sizing: border-box;
    transition: background 0.2s;
}
body > ul > li > a:hover {
    background: #FFF;
    color: #000;
}
</style>
</head>

<body>
<ul>
<li><a href="about.html" target="right">Home</a></li>
<li><a href="single.html" target="right">Single</a></li>
<li><a href="album.html" target="right">Album</a></li>
<li><a href="dvd.html" target="right">DVD</a></li>
<li><a href="bluray.html" target="right">Blu-ray</a></li>
<li><a href="book.html" target="right">Book</a></li>
<li><a href="other.html" target="right">Other</a></li>
</ul>

<!--CLOSE MENU FOR details li link-->
<script type="text/javascript">
document.addEventListener('click', function(e) { var link = e.target.closest('a');
if (link && link.target === 'right') { var hrefVal = link.getAttribute('href');
if (hrefVal && hrefVal.indexOf('#') !== -1) window.parent.postMessage('load', '*'); }});
</script>
</body>
</html>
