<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta name="robots" content="none">
<meta name="theme-color" content="#000000">
<title>About</title>
<style type="text/css">
/* GITHUB FONTS IMPORT */
@font-face { font-family: 'Trona-bold'; src: local('Trona Bold'), local('Trona-Bold'), url('fonts/Trona-bold.woff') format('woff'); }

/* PROFILE LAYOUT */
html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior: none; background-color: #000000; }
body { font-size: 16px; font-family: "Trona-bold", "Times New Roman", sans-serif; color: #ffffff; }

/* BASE RESET */
h2, ul, li { margin: 0; padding: 0; outline: 0; }
ul { list-style: none; }

/* TD & IMG FIX */
img { border: 0; display: block; }

/* ELEMENT & ICON */
a { background: transparent; text-decoration: none; color: #003399; margin: 0; padding: 0; vertical-align: baseline; }
a:hover { color: #ff0000; text-decoration: underline; }

/* SMALL SCREEN FIX */
@media screen and (max-width: 600px) { #title-text, #scramble { font-size: 36px !important; } #content-text { font-size: 16px !important; } }

/* ANIMATION FIX */
#scramble { transform: translateZ(0);
-webkit-transform: translateZ(0);
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
display: inline-block;
white-space: nowrap; }

/* SCROLL WRAPPER */
.scroll-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 5px; }
.scroll-wrapper::-webkit-scrollbar { height: 5px !important; display: block !important; visibility: visible !important; }
.scroll-wrapper::-webkit-scrollbar-track { background: #222 !important; border-radius: 0 !important; }
.scroll-wrapper::-webkit-scrollbar-thumb { background: #666 !important; border-radius: 0 !important; border: none !important; }

/* IMG */
.gallery-img { display: inline-block; width: 130px; height: 130px; object-fit: cover; object-position: top; margin-right: 10px; cursor: pointer;
filter: grayscale(100%); -webkit-filter: grayscale(100%); transition: filter 0.4s ease, -webkit-filter 0.4s ease; }
.gallery-img:last-child { margin-right: 0; }
.gallery-img:hover { filter: grayscale(0%); -webkit-filter: grayscale(0%); }
</style>
</head>

<body>

<table width="100%" height="100%" border="0" cellpadding="0" cellspacing="0">
<tbody>
<tr>
<td align="center" valign="middle" style="padding-top: 20px; padding-bottom: 50px;">
<div class="scroll-wrapper">
<table width="100%" border="0" cellpadding="0" cellspacing="0" style="max-width: 600px; min-width: 300px; margin: 0 auto; table-layout: fixed;">
<tbody>
<!--TITLE-->
<tr>
<td align="center" valign="bottom" style="padding: 0 20px 15px 20px;"> 
<span id="title-text" style="display: block; width: 100%; text-align: left; font-size: 44px; color: #888; line-height: 1.2; white-space: nowrap;">
About <span id="scramble" style="color: #fff;"></span></span>
</td>
</tr>
<!--TEXT-->
<tr>
<td align="center" valign="top" style="padding: 15px 20px 0 20px;">
<span id="content-text" style="display: block; width: 100%; text-align: left; font-size: 18px; color: #ddd; line-height: 1.6; font-family: 'Times New Roman', serif;">ZARD was a Japanese musical unit centered around <span style="white-space: nowrap;">Izumi Sakai / 坂井泉水</span><br>Even after Izumi Sakai's passing, her works live on as timeless standards</span>
</td>
</tr>
<!--SPACE-->
<tr>
<td align="left" valign="bottom" style="padding: 100px 20px 15px 20px;"> 
</td>
</tr>
<!--PHOTO SLIDE-->
<tr>
<td align="left" valign="top" style="padding: 0 20px 0 20px;">
<div class="scroll-wrapper" style="width: 100%; white-space: nowrap; text-align: left;">
<img src="img/1.jpg" decoding="async" loading="lazy" class="gallery-img" draggable="false" onclick="openLightbox(this.src)">
<img src="img/2.jpg" decoding="async" loading="lazy" class="gallery-img" draggable="false" onclick="openLightbox(this.src)">
<img src="img/3.jpg" decoding="async" loading="lazy" class="gallery-img" draggable="false" onclick="openLightbox(this.src)">
<img src="img/4.jpg" decoding="async" loading="lazy" class="gallery-img" draggable="false" onclick="openLightbox(this.src)">
<img src="img/5.jpg" decoding="async" loading="lazy" class="gallery-img" draggable="false" onclick="openLightbox(this.src)">
<img src="img/6.jpg" decoding="async" loading="lazy" class="gallery-img" draggable="false" onclick="openLightbox(this.src)">
<img src="img/7.jpg" decoding="async" loading="lazy" class="gallery-img" draggable="false" onclick="openLightbox(this.src)">
<img src="img/8.jpg" decoding="async" loading="lazy" class="gallery-img" draggable="false" onclick="openLightbox(this.src)">
</div>
</td>
</tr>
</tbody>
</table>
</div>
</td>
</tr>
</tbody>
</table>

<!--IMG LIGHT BOX-->
<div id="lightbox" style="display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); align-items: center; justify-content: center; cursor: zoom-out;" onclick="this.style.display='none'">
<img id="lightbox-img" src="" style="max-width: 90%; max-height: 90%;">
</div>
<script>
function openLightbox(imageSrc) { document.getElementById('lightbox-img').src = imageSrc; document.getElementById('lightbox').style.display = 'flex'; }
</script>
<!--SMALL SCREEN JS-->
<script src="scramble.js"></script>
<script src="small-screen-btn.js"></script>
</body>
</html>
