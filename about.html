<!DOCTYPE html>
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta name="robots" content="none">
<meta name="theme-color" content="#000000">
<title>About</title>
<style type="text/css">
/* FONTS IMPORT */
@font-face { font-family: 'trona-bold'; src: local('Trona Bold'), local('trona-Bold'), url('fonts/trona-bold.woff') format('woff'); }

/* PROFILE LAYOUT */
html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior: none; background-color: #000000; }
body { font-size: 16px; font-family: "trona-bold", "Times New Roman", sans-serif; color: #ffffff; }

/* BASE RESET */
h2, ul, li { margin: 0; padding: 0; outline: 0; }
ul { list-style: none; }

/* TD & IMG FIX */
img { border: 0; display: block; }

/* ELEMENT & ICON */
a { background: transparent; text-decoration: none; color: #003399; margin: 0; padding: 0; vertical-align: baseline; }
a:hover { color: #ff0000; text-decoration: underline; }

/* ANIMATION FIX */
#scramble { transform: translateZ(0); -webkit-transform: translateZ(0); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: inline-block; white-space: nowrap; }

/* SCROLL WRAPPER */
.scroll-wrapper { width: 100%; padding-bottom: 5px; }
.scroll-wrapper::-webkit-scrollbar { display: none !important; }

/* EMBLA CAROUSEL */
.embla { overflow: hidden; width: 100%; opacity: 0; transition: opacity 0.4s ease-in; }
.embla.is-ready { opacity: 1; }
.embla__container { display: flex; touch-action: pan-y; margin: 0 -10px; }
.embla__slide { flex: 0 0 auto; min-width: 0; padding: 0 10px; }

/* PHOTO GALLERY */
.gallery-img { display: block; width: 344px; height: 175px; cursor: pointer; object-fit: cover; 
filter: grayscale(100%); -webkit-filter: grayscale(100%); transition: filter 0.8s ease; 
user-select: none; -webkit-user-select: none; -webkit-user-drag: none; 
-webkit-tap-highlight-color: transparent; }
.is-colored .gallery-img { filter: grayscale(0%); }

/* NAV ARROW BUTTONS */
.nav-arrow { color: #888; cursor: pointer; transition: color 0.3s; display: flex; align-items: center; }
@media (hover: hover) and (pointer: fine) { .nav-arrow:hover { color: #fff; } }
.nav-arrow:active { color: #fff; transition: none; }

/* SMALL SCREEN FIX */
@media screen and (max-width: 600px) { 
#title-text, #scramble { font-size: 36px !important; } 
#content-text { font-size: 16px !important; } 
.gallery-img { width: clamp(180px, 60vw, 300px) !important; height: auto !important; aspect-ratio: 16 / 10; } }
</style>
</head>

<body>
<table width="100%" height="100%" border="0" cellpadding="0" cellspacing="0">
<tbody>
<tr>
<td align="center" valign="middle" style="padding: 50px 20px 100px 20px;">
<div class="scroll-wrapper">
<table width="100%" border="0" cellpadding="0" cellspacing="0" style="max-width: 600px; min-width: 300px; margin: 0 auto; table-layout: fixed;">
<tbody>
<!--TITLE-->
<tr>
<td align="center" valign="bottom"> 
<span id="title-text" style="display: block; width: 100%; text-align: left; font-size: 44px; color: #888; line-height: 1.2; white-space: nowrap;">
About <span id="scramble" style="color: #fff;"></span></span>
</td>
</tr>
<!--SPACE-->
<tr><td style="height: 30px;"></td></tr>
<!--TEXT-->
<tr>
<td align="center" valign="top">
<span id="content-text" style="display: block; width: 100%; text-align: left; font-size: 18px; color: #ddd; line-height: 1.6; font-family: 'Times New Roman', serif;">ZARD was a Japanese musical unit centered around <span style="white-space: nowrap;">Izumi Sakai / 坂井泉水</span><br>Even after Izumi Sakai's passing, her works live on as timeless standards</span>
</td>
</tr>
<!--SPACE-->
<tr><td style="height: 120px;"></td></tr>
<!--PHOTO-->
<tr>
<td class="slider-cell" align="left" valign="top">
<div class="embla" id="embla-slider">
<div class="embla__container">
<div class="embla__slide"><img src="photo/thumb/01.jpg" class="gallery-img" draggable="false" data-lightbox="photo/01.jpg"></div>
<div class="embla__slide"><img src="photo/thumb/02.jpg" class="gallery-img" draggable="false" data-lightbox="photo/02.jpg"></div>
<div class="embla__slide"><img src="photo/thumb/03.jpg" class="gallery-img" draggable="false" data-lightbox="photo/03.jpg"></div>
<div class="embla__slide"><img src="photo/thumb/04.jpg" class="gallery-img" draggable="false" data-lightbox="photo/04.jpg"></div>
<div class="embla__slide"><img src="photo/thumb/05.jpg" class="gallery-img" draggable="false" data-lightbox="photo/05.jpg"></div>
<div class="embla__slide"><img src="photo/thumb/06.jpg" class="gallery-img" draggable="false" data-lightbox="photo/06.jpg"></div>
<div class="embla__slide"><img src="photo/thumb/07.jpg" class="gallery-img" draggable="false" data-lightbox="photo/07.jpg"></div>
<div class="embla__slide"><img src="photo/thumb/08.jpg" class="gallery-img" draggable="false" data-lightbox="photo/08.jpg"></div>
</div>
</div>
</td>
</tr>
<!--NARROW-->
<tr>
<td align="center" valign="top" style="padding-top: 20px;">
<div style="display: flex; justify-content: center; gap: 120px; user-select: none;">
<span id="btn-prev" class="nav-arrow">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
</span>
<span id="btn-next" class="nav-arrow">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
</span>
</div>
</td>
</tr>
</tbody>
</table>
</div>
</td>
</tr>
</tbody>
</table>
<!--IMG LIGHT BOX-->
<div id="lightbox" style="display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); align-items: center; justify-content: center; cursor: zoom-out;" onclick="this.style.display='none'">
<img id="lightbox-img" src="" style="max-width: 90%; max-height: 90%;">
</div>
<script>
function openLightbox(imageSrc) { document.getElementById('lightbox-img').src = imageSrc; document.getElementById('lightbox').style.display = 'flex'; }
</script>

<!--EMBLA CAROUSEL SETTING-->

<script src="assets/libs/embla-carousel.umd.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const emblaNode = document.getElementById('embla-slider');
    
    // INIT ENGINE
    const emblaApi = EmblaCarousel(emblaNode, { align: 'center', loop: true, skipSnaps: false, dragFree: false });

    // NAV BUTTONS
    document.getElementById('btn-prev').addEventListener('click', () => emblaApi.scrollPrev());
    document.getElementById('btn-next').addEventListener('click', () => emblaApi.scrollNext());

    // COLOR LOGIC
    const slides = emblaApi.slideNodes();
    const applyColor = () => {
        const selected = emblaApi.selectedScrollSnap();
        slides.forEach((slide, i) => {
            i === selected ? slide.classList.add('is-colored') : slide.classList.remove('is-colored');
        });
    };

    emblaApi.on('init', () => { emblaNode.classList.add('is-ready'); applyColor(); });
    emblaApi.on('select', applyColor);

    // CLICK & TOUCH
    emblaNode.addEventListener('click', (e) => {
		if (!emblaApi.clickAllowed()) return;
		
        const slide = e.target.closest('.embla__slide');
        if (!slide) return;
        
        const index = slides.indexOf(slide);
        if (index === emblaApi.selectedScrollSnap()) {
            const img = slide.querySelector('.gallery-img');
            if (img) openLightbox(img.getAttribute('data-lightbox'));
        } else {
            emblaApi.scrollTo(index);
        }
    });
});
</script>

<script src="assets/js/scramble.js"></script>
<script src="assets/js/small-screen-btn.js"></script>

</body>
</html>
