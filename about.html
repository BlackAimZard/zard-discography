/* GITHUB FONTS IMPORT */
@font-face { font-family: 'trona-bold'; src: local('Trona Bold'), local('Trona-Bold'), url('fonts/trona-bold.woff') format('woff'); }

/* PROFILE LAYOUT */
html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior: none; background-color: #000000; }
body { font-size: 16px; font-family: "Trona-bold", "Times New Roman", sans-serif; color: #ffffff; }

/* BASE RESET */
h2, ul, li { margin: 0; padding: 0; outline: 0; }
ul { list-style: none; }

/* TD & IMG FIX */
img { border: 0; display: block; }

/* ELEMENT & ICON */
a { background: transparent; text-decoration: none; color: #003399; margin: 0; padding: 0; vertical-align: baseline; }
a:hover { color: #ff0000; text-decoration: underline; }

/* SMALL SCREEN FIX */
@media screen and (max-width: 600px) { #title-text, #scramble { font-size: 36px !important; } #content-text { font-size: 16px !important; } }

/* ANIMATION FIX */
#scramble { transform: translateZ(0);
-webkit-transform: translateZ(0);
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
display: inline-block;
white-space: nowrap; }

/* SCROLL WRAPPER */
.scroll-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 5px; -ms-overflow-style: none; scrollbar-width: none; }
.scroll-wrapper::-webkit-scrollbar { display: none !important; }

/* IMG */
.gallery-img { display: inline-block; width: 130px; height: 130px; object-fit: cover; object-position: top; margin-right: 10px; cursor: pointer;
filter: grayscale(100%); -webkit-filter: grayscale(100%); transition: filter 0.4s ease, -webkit-filter 0.4s ease; flex-shrink: 0; vertical-align: top; }
.gallery-img:hover { filter: grayscale(0%); -webkit-filter: grayscale(0%); }
</style>

<!-- NEXT-PREV -->
<script>
let isSliding=false,isDragging=false,dragged=false,startX,startScroll;
const t=document.getElementById('slider-track'),w=140,setW=t.children.length*w;

// NHÂN BẢN KHÔNG GIAN
t.innerHTML+=t.innerHTML+t.innerHTML; t.scrollLeft=setW;

// MẮT THẦN: Phát hiện thiết bị cảm ứng (Mobile/Tablet)
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

let doNext, doPrev; // Biến gá tạm để phân luồng nút bấm

if (isTouch) {
    // ============================================================
    // 📱 MOBILE MODE: THẢ RÔNG CHO TRÌNH DUYỆT MẶC ĐỊNH XỬ LÝ
    // ============================================================
    t.style.overflowX = 'auto'; // Trả lại thanh cuộn mặc định
    t.style.scrollSnapType = 'x mandatory'; // Bật hút nam châm của hệ điều hành
    Array.from(t.children).forEach(img => img.style.scrollSnapAlign = 'start');

    // Chờ Mobile vuốt xong thả tay ra mới lén lút Teleport (Vòng lặp)
    let scrollTimeout;
    t.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
            const c = t.scrollLeft;
            if (c < setW) {
                t.style.scrollSnapType = 'none'; t.scrollLeft += setW;
                requestAnimationFrame(() => t.style.scrollSnapType = 'x mandatory');
            } else if (c >= setW * 2) {
                t.style.scrollSnapType = 'none'; t.scrollLeft -= setW;
                requestAnimationFrame(() => t.style.scrollSnapType = 'x mandatory');
            }
        }, 100);
    });

    // Nút bấm trên Mobile dùng lệnh cuộn mượt mặc định
    doNext = () => t.scrollBy({ left: w, behavior: 'smooth' });
    doPrev = () => t.scrollBy({ left: -w, behavior: 'smooth' });

} else {
    // ============================================================
    // 💻 PC MODE: CHẠY CODE CHUẨN CỦA ĐẠI CA (Custom Drag & Snap)
    // ============================================================
    t.style.overflowX = 'hidden'; // Giấu thanh cuộn trên PC cho sang

    function smoothScrollTo(tgt,cb){
        const st=t.scrollLeft,chg=tgt-st,sT=performance.now();
        function animate(cur){
            const p=Math.min((cur-sT)/250,1),e=0.5-Math.cos(p*Math.PI)/2;
            t.scrollLeft=st+chg*e;
            if(p<1)requestAnimationFrame(animate);
            else{
                const c=Math.round(t.scrollLeft);
                if(c<setW)t.scrollLeft+=setW;else if(c>=setW*2)t.scrollLeft-=setW;
                if(cb)cb();
            }
        }
        requestAnimationFrame(animate);
    }

    function snap(tgt){isSliding=true;smoothScrollTo(tgt,()=>isSliding=false);}

    const startDrag=x=>{
        if(isSliding)return;
        isDragging=true;dragged=false;startX=x;startScroll=t.scrollLeft;
        t.style.cursor='grabbing';
    };

    const onDrag=x=>{
        if(!isDragging||isSliding)return;
        if(Math.abs(startX-x)>5)dragged=true;
        t.scrollLeft=startScroll+(startX-x);
    };

    const endDrag=()=>{
        if(!isDragging)return;
        isDragging=false; t.style.cursor='';
        snap(Math.round(t.scrollLeft/w)*w);
    };

    t.addEventListener('click',e=>{if(dragged){e.preventDefault();e.stopPropagation();}},true);
    t.addEventListener('mousedown',e=>startDrag(e.pageX));
    t.addEventListener('mousemove',e=>{if(isDragging){e.preventDefault();onDrag(e.pageX);}});
    t.addEventListener('mouseup',endDrag); 
    t.addEventListener('mouseleave',endDrag);

    // Nút bấm trên PC giữ nguyên hàm Custom xịn xò
    doNext = () => { if(!isSliding)snap(Math.round(t.scrollLeft/w)*w+w); };
    doPrev = () => { if(!isSliding)snap(Math.round(t.scrollLeft/w)*w-w); };
}

// Bơm chức năng vào 2 nút bấm ngoài giao diện
function slideNext() { doNext(); }
function slidePrev() { doPrev(); }
</script>
