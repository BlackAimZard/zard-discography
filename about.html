<!DOCTYPE html>
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta name="robots" content="none">
<meta name="theme-color" content="#000000">
<title>About</title>

<link rel="stylesheet" type="text/css" href="assets/libs/slick.css">

<style type="text/css">
/* FONTS IMPORT */
@font-face { font-family: 'trona-bold'; src: local('Trona Bold'), local('trona-Bold'), url('fonts/trona-bold.woff') format('woff'); }

/* PROFILE LAYOUT */
html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior: none; background-color: #000000; }
body { font-size: 16px; font-family: "trona-bold", "Times New Roman", sans-serif; color: #ffffff; }

/* BASE RESET */
h2, ul, li { margin: 0; padding: 0; outline: 0; }
ul { list-style: none; }

/* TD & IMG FIX */
img { border: 0; display: block; }

/* ELEMENT & ICON */
a { background: transparent; text-decoration: none; color: #003399; margin: 0; padding: 0; vertical-align: baseline; }
a:hover { color: #ff0000; text-decoration: underline; }

/* ANIMATION FIX */
#scramble { transform: translateZ(0); -webkit-transform: translateZ(0); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: inline-block; white-space: nowrap; }

/* SCROLL WRAPPER */
.scroll-wrapper { width: 100%; padding-bottom: 5px; }
.scroll-wrapper::-webkit-scrollbar { display: none !important; }

/* SLICK */
.slick-slider .slick-track, .slick-slider .slick-list { will-change: transform; }
.slick-slide { padding: 0 10px; outline: none !important; transform: translateZ(0); will-change: transform; }

/* PHOTO GALLERY */
.gallery-img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; cursor: pointer;
filter: grayscale(100%); -webkit-filter: grayscale(100%); transition: filter 0.8s ease; object-fit: cover;
user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: transparent; }
.is-colored .gallery-img { filter: grayscale(0%); -webkit-filter: grayscale(0%); }

/* NAV ARROW BUTTONS */
.nav-arrow { color: #888; cursor: pointer; transition: color 0.3s; display: flex; align-items: center; }
@media (hover: hover) and (pointer: fine) { .nav-arrow:hover { color: #fff; } }
.nav-arrow:active { color: #fff; transition: none; }
.nav-arrow.slick-disabled { opacity: 0.5; cursor: default; } 

/* SMALL SCREEN FIX */
@media screen and (max-width: 650px) { .main-wrapper { padding-left: 20px !important; padding-right: 20px !important; } }
@media screen and (max-width: 600px) { 
#title-text, #scramble { font-size: 36px !important; } 
#content-text { font-size: 16px !important; } 
#slider-track { width: calc(100% + 40px) !important; margin-left: -20px !important; } }
</style>
</head>

<body>
<table width="100%" height="100%" border="0" cellpadding="0" cellspacing="0">
<tbody>
<tr>
<td class="main-wrapper" align="center" valign="middle" style="padding: 50px 0 100px 0;">
<div class="scroll-wrapper">
<table width="100%" border="0" cellpadding="0" cellspacing="0" style="max-width: 600px; min-width: 300px; margin: 0 auto; table-layout: fixed;">
<tbody>
<!--TITLE-->
<tr>
<td align="center" valign="bottom"> 
<span id="title-text" style="display: block; width: 100%; text-align: left; font-size: 44px; color: #888; line-height: 1.2; white-space: nowrap;">
About <span id="scramble" style="color: #fff;"></span></span>
</td>
</tr>
<!--SPACE-->
<tr><td style="height: 30px;"></td></tr>
<!--TEXT-->
<tr>
<td align="center" valign="top">
<span id="content-text" style="display: block; width: 100%; text-align: left; font-size: 18px; color: #ddd; line-height: 1.6; font-family: 'Times New Roman', serif;">ZARD was a Japanese musical unit centered around <span style="white-space: nowrap;">Izumi Sakai / 坂井泉水</span><br>Even after Izumi Sakai's passing, her works live on as timeless standards</span>
</td>
</tr>
<!--SPACE-->
<tr><td style="height: 120px;"></td></tr>
<!--PHOTO-->
<tr>
<td class="slider-cell" align="left" valign="top">
<div id="slider-track" style="width: 100%; opacity: 0; transition: opacity 0.3s;">
    <div data-caption="Tokyo, 1990"><img src="assets/photo/thumb/1990.jpg" class="gallery-img" draggable="false" data-lightbox="assets/photo/1990.jpg"></div>
    <div data-caption="Tokyo, 1991"><img src="assets/photo/thumb/1991.jpg" class="gallery-img" draggable="false" data-lightbox="assets/photo/1991.jpg"></div>
    <div data-caption="Kanagawa, 1992"><img src="assets/photo/thumb/1992-1.jpg" class="gallery-img" draggable="false" data-lightbox="assets/photo/1992-1.jpg"></div>
    <div data-caption="Tokyo, 1992"><img src="assets/photo/thumb/1992-2.jpg" class="gallery-img" draggable="false" data-lightbox="assets/photo/1992-2.jpg"></div>
</div>
</td>
</tr>
<!--NARROW-->
<tr>
<td align="center" valign="top" style="padding-top: 20px;">
<div style="display: flex; justify-content: center; align-items: center; gap: 0px; user-select: none;">
<span id="btn-prev" class="nav-arrow">
<!--PREV BUTTON-->
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
</span>
<!--PHOTO DATA CAPTION SETTING-->
<span id="slide-caption" style="display: inline-block; height: 36px; line-height: 36px; width: 150px; text-align: center; font-size: 14px; color: #888; font-family: 'Times New Roman', serif; opacity: 0; transition: opacity 0.1s ease;"></span>
<!--NEXT BUTTON-->
<span id="btn-next" class="nav-arrow">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
</span>
</div>
</td>
</tr>
</tbody>
</table>
</div>
</td>
</tr>
</tbody>
</table>
<!--IMG LIGHT BOX-->
<div id="lightbox" style="display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); align-items: center; justify-content: center; cursor: zoom-out;" onclick="this.style.display='none'">
<img id="lightbox-img" src="" style="max-width: 90%; max-height: 90%;">
</div>
<script>
function openLightbox(imageSrc) { document.getElementById('lightbox-img').src = imageSrc; document.getElementById('lightbox').style.display = 'flex'; }
</script>
<!--SLICK SETTING-->
<script src="assets/libs/jquery.min.js"></script>
<script src="assets/libs/slick.min.js"></script>

<script>
$(document).ready(function(){

    const captionNode = $('#slide-caption');
    let captionTimeout = null;

    // COLOR AND CAPTION LOGIC
    const applySlideEffects = (slick, index, isInit = false) => {
        let imgId = $(slick.$slides[index]).find('.gallery-img').attr('data-lightbox');
        slick.$slider.find('.slick-slide').removeClass('is-colored')
                     .has(`.gallery-img[data-lightbox="${imgId}"]`).addClass('is-colored');

        let newCaption = $(slick.$slides[index]).attr('data-caption') || '';

        if (isInit) {
            captionNode.text(newCaption).css('opacity', '1');
        } else {
            clearTimeout(captionTimeout);
            captionNode.css('opacity', '0');
            
            captionTimeout = setTimeout(() => {
                captionNode.text(newCaption).css('opacity', '1');
            }, 300);
        }
    };

    // SLICK EVENTS
    $('#slider-track')
        .on('init', (e, slick) => {
            slick.$slider.css('opacity', '1');
            applySlideEffects(slick, 0, true);
        })
        .on('beforeChange', (e, slick, currentSlide, nextSlide) => {
            applySlideEffects(slick, nextSlide, false);
        });

    // SLICK CONFIG
    $('#slider-track').slick({
        centerMode: true,
        centerPadding: '104px',
        slidesToShow: 1,
        infinite: true,
        speed: 400,
		touchThreshold: 10,
        cssEase: 'ease-out',
        prevArrow: $('#btn-prev'),
        nextArrow: $('#btn-next'),
        responsive: [ {
            breakpoint: 600,
            settings: {
                centerMode: true,
                centerPadding: '50px',
                slidesToShow: 1 
            } 
        } ]
    });

    // TOUCH & CLICK LOGIC
    let isDragging = false;
    
    $('#slider-track')
        .on('mousedown touchstart', function() {
            isDragging = false;
        })
        .on('mousemove touchmove', function() {
            isDragging = true;
        })
        .on('click', '.slick-slide', function(e) {
            if (isDragging) return;

            if (!$(e.target).hasClass('gallery-img')) return;

            if ($(this).hasClass('slick-center')) {
                let imageSrc = $(this).find('.gallery-img').attr('data-lightbox');
                if (imageSrc) openLightbox(imageSrc); 
            } else {
                let slideIndex = parseInt($(this).attr('data-slick-index'), 10);
                $('#slider-track').slick('slickGoTo', slideIndex); 
            } 
        });

});
</script>

<!--JS IMPORT-->
<script src="assets/js/scramble.js"></script>
<script src="assets/js/small-screen-btn.js"></script>

</body>
</html>
