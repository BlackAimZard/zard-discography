<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta name="robots" content="none">
<meta name="theme-color" content="#000000">
<title>About</title>
<style type="text/css">
/* GITHUB FONTS IMPORT */
@font-face { font-family: 'trona-bold'; src: local('Trona Bold'), local('Trona-Bold'), url('fonts/trona-bold.woff') format('woff'); }

/* PROFILE LAYOUT */
html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior: none; background-color: #000000; }
body { font-size: 16px; font-family: "Trona-bold", "Times New Roman", sans-serif; color: #ffffff; }

/* BASE RESET */
h2, ul, li { margin: 0; padding: 0; outline: 0; }
ul { list-style: none; }

/* TD & IMG FIX */
img { border: 0; display: block; }

/* ELEMENT & ICON */
a { background: transparent; text-decoration: none; color: #003399; margin: 0; padding: 0; vertical-align: baseline; }
a:hover { color: #ff0000; text-decoration: underline; }

/* SMALL SCREEN FIX */
@media screen and (max-width: 600px) { 
#title-text, #scramble { font-size: 36px !important; } 
#content-text { font-size: 16px !important; } 
.gallery-img { width: clamp(180px, 60vw, 300px) !important; height: auto !important; aspect-ratio: 300 / 175; } }

/* ANIMATION FIX */
#scramble { transform: translateZ(0); -webkit-transform: translateZ(0); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: inline-block; white-space: nowrap; }

/* SCROLL WRAPPER */
.scroll-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 5px; -ms-overflow-style: none; scrollbar-width: none; }
.scroll-wrapper::-webkit-scrollbar { display: none !important; }

/* IMG */
.gallery-img { display: inline-block; width: 300px; height: 175px; margin-right: 15px; cursor: pointer;
filter: grayscale(100%); -webkit-filter: grayscale(100%); flex-shrink: 0; vertical-align: top; 
user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>

<body>
<table width="100%" height="100%" border="0" cellpadding="0" cellspacing="0">
<tbody>
<tr>
<td align="center" valign="middle" style="padding-top: 50px; padding-bottom: 100px;">
<div class="scroll-wrapper">
<table width="100%" border="0" cellpadding="0" cellspacing="0" style="max-width: 600px; min-width: 300px; margin: 0 auto; table-layout: fixed;">
<tbody>
<!--TITLE-->
<tr>
<td align="center" valign="bottom" style="padding: 0 20px;"> 
<span id="title-text" style="display: block; width: 100%; text-align: left; font-size: 44px; color: #888; line-height: 1.2; white-space: nowrap;">
About <span id="scramble" style="color: #fff;"></span></span>
</td>
</tr>
<!--SPACE-->
<tr><td style="height: 30px; padding: 0 20px;"></td></tr>
<!--TEXT-->
<tr>
<td align="center" valign="top" style="padding: 0 20px;">
<span id="content-text" style="display: block; width: 100%; text-align: left; font-size: 18px; color: #ddd; line-height: 1.6; font-family: 'Times New Roman', serif;">ZARD was a Japanese musical unit centered around <span style="white-space: nowrap;">Izumi Sakai / 坂井泉水</span><br>Even after Izumi Sakai's passing, her works live on as timeless standards</span>
</td>
</tr>
<!--SPACE-->
<tr><td style="height: 120px; padding: 0 20px;"></td></tr>
<!--PHOTO SLIDE-->
<tr>
<td class="slider-cell" align="left" valign="top" style="padding: 0 20px 0 20px;">
<div id="slider-track" class="scroll-wrapper" style="width: 100%; display: flex; text-align: left; overflow-anchor: none; overflow-x: hidden; touch-action: pan-y;">
<img src="photo/thumb/01.jpg" class="gallery-img" draggable="false" onclick="openLightbox('photo/01.jpg')">
<img src="photo/thumb/02.jpg" class="gallery-img" draggable="false" onclick="openLightbox('photo/02.jpg')">
<img src="photo/thumb/03.jpg" class="gallery-img" draggable="false" onclick="openLightbox('photo/03.jpg')">
<img src="photo/thumb/04.jpg" class="gallery-img" draggable="false" onclick="openLightbox('photo/04.jpg')">
<img src="photo/thumb/05.jpg" class="gallery-img" draggable="false" onclick="openLightbox('photo/05.jpg')">
<img src="photo/thumb/06.jpg" class="gallery-img" draggable="false" onclick="openLightbox('photo/06.jpg')">
<img src="photo/thumb/07.jpg" class="gallery-img" draggable="false" onclick="openLightbox('photo/07.jpg')">
<img src="photo/thumb/08.jpg" class="gallery-img" draggable="false" onclick="openLightbox('photo/08.jpg')">
</div>
</td>
</tr>
<tr>
<td align="center" valign="top" style="padding-top: 10px;">
<div style="display: flex; justify-content: center; gap: 120px; color: #888; user-select: none;">
<span style="cursor: pointer; transition: color 0.3s; display: flex; align-items: center;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#888'" onclick="slidePrev()">
<svg width="60" height="36" viewBox="0 0 40 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="39 8 4 8 11 15 14 12"></polyline></svg>
</span>
<span style="cursor: pointer; transition: color 0.3s; display: flex; align-items: center;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#888'" onclick="slideNext()">
<svg width="60" height="36" viewBox="0 0 40 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="1 8 36 8 29 15 26 12"></polyline></svg>
</span>
</div>
</td>
</tr>
</tbody>
</table>
</div>
</td>
</tr>
</tbody>
</table>

<!--IMG LIGHT BOX-->
<div id="lightbox" style="display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); align-items: center; justify-content: center; cursor: zoom-out;" onclick="this.style.display='none'">
<img id="lightbox-img" src="" style="max-width: 90%; max-height: 90%;">
</div>
<script>
function openLightbox(imageSrc) { document.getElementById('lightbox-img').src = imageSrc; document.getElementById('lightbox').style.display = 'flex'; }
</script>

<!--NEXT-PREV-->
<script>
const viewport = document.getElementById('slider-track'), track = document.createElement('div');
track.style.cssText = 'display:flex;will-change:transform;transform-style:preserve-3d;';
while(viewport.firstChild) track.appendChild(viewport.firstChild);
viewport.appendChild(track); viewport.style.overflow = 'hidden';

const originalLength = track.children.length;
track.innerHTML += track.innerHTML + track.innerHTML;
const images = track.querySelectorAll('.gallery-img'), colorProgress = new Array(originalLength).fill(0);

let w=0, os=0, setW=0, currentX=0, targetX=0, isDragging=false, dragged=false, startClientX=0, startTargetX=0, lastActiveIndex=-1, isAnimating=false, resizeTimer;

const measure = () => {
 if(!images[0]) return;
 const rect = images[0].getBoundingClientRect();
 w = rect.width + parseFloat(window.getComputedStyle(images[0]).marginRight || 0);
 os = (viewport.getBoundingClientRect().width - rect.width) / 2;
 setW = originalLength * w;
};

const wakeUp = () => { if(!isAnimating) { isAnimating = true; renderLoop(); } };

const renderLoop = () => {
 if(isDragging) currentX = targetX;
 else { const diff = targetX - currentX; currentX += Math.abs(diff) < 0.1 ? diff : diff * 0.08; }

 if(currentX < setW - os - w/2) { currentX += setW; targetX += setW; startTargetX += setW; }
 else if(currentX > setW * 2 - os + w/2) { currentX -= setW; targetX -= setW; startTargetX -= setW; }
 track.style.transform = `translate3d(${-currentX}px, 0, 0)`;

 let realIndex = ((Math.round((currentX + os) / w) % originalLength) + originalLength) % originalLength;
 let classChanged = realIndex !== lastActiveIndex;
 let colorAnimating = false; 

 for(let i=0; i<originalLength; i++) {
  let targetC = (i === realIndex ? 1 : 0);
  let diff = targetC - colorProgress[i];
  if(Math.abs(diff) > 0.005) { 
      colorProgress[i] += diff * 0.1; 
      colorAnimating = true; 
  } else { 
      colorProgress[i] = targetC; 
  }
 }

 images.forEach((img, i) => {
  let m = i % originalLength;
  let gv = Math.round((1 - colorProgress[m]) * 100);
  let val = `grayscale(${gv}%)`;
  
  if(img.dataset.gv !== val) {
     img.style.filter = img.style.WebkitFilter = val;
     img.dataset.gv = val;
  }
  if(classChanged) img.classList.toggle('active-center', m === realIndex);
 });

 if(classChanged) lastActiveIndex = realIndex;

 if(isDragging || Math.abs(targetX - currentX) >= 0.1 || colorAnimating) requestAnimationFrame(renderLoop);
 else isAnimating = false; 
};

measure(); targetX = currentX = originalLength * w - os; wakeUp();

const getX = e => e.touches ? e.touches[0].clientX : e.clientX;
const onDown = e => { isDragging=true; dragged=false; startClientX=getX(e); startTargetX=targetX=currentX; viewport.style.cursor='grabbing'; wakeUp(); };
const onMove = e => { if(!isDragging) return; const d = startClientX - getX(e); if(Math.abs(d) > 5) dragged=true; targetX = startTargetX + d; wakeUp(); };
const onUp = () => { if(!isDragging) return; isDragging=false; viewport.style.cursor=''; const d = targetX - startTargetX; let N = Math.round((targetX + os) / w); targetX = (d > 35 ? N+1 : d < -35 ? N-1 : N) * w - os; wakeUp(); };

viewport.addEventListener('mousedown', onDown); window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
viewport.addEventListener('touchstart', onDown, {passive:true}); viewport.addEventListener('touchmove', onMove, {passive:true}); 
viewport.addEventListener('touchend', onUp); viewport.addEventListener('touchcancel', onUp);
viewport.addEventListener('click', e => { if(dragged){ e.preventDefault(); e.stopPropagation(); } }, true);

const slide = dir => { targetX = Math.round((targetX + os) / w + dir) * w - os; wakeUp(); };
window.slideNext = () => slide(1);
window.slidePrev = () => slide(-1);

window.addEventListener('resize', () => {
 const set = () => { 
     let oldW = w; 
     measure(); 
     if(w !== oldW && oldW > 0) {
         targetX = currentX = (originalLength + Math.max(0, lastActiveIndex)) * w - os; 
         wakeUp();
     }
 };
 clearTimeout(resizeTimer); resizeTimer = setTimeout(set, 150);
});
</script>

<script src="scramble.js"></script>

</body>
</html>
