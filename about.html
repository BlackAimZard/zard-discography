/* GITHUB FONTS IMPORT */
@font-face { font-family: 'trona-bold'; src: local('Trona Bold'), local('Trona-Bold'), url('fonts/trona-bold.woff') format('woff'); }

/* PROFILE LAYOUT */
html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior: none; background-color: #000000; }
body { font-size: 16px; font-family: "Trona-bold", "Times New Roman", sans-serif; color: #ffffff; }

/* BASE RESET */
h2, ul, li { margin: 0; padding: 0; outline: 0; }
ul { list-style: none; }

/* TD & IMG FIX */
img { border: 0; display: block; }

/* ELEMENT & ICON */
a { background: transparent; text-decoration: none; color: #003399; margin: 0; padding: 0; vertical-align: baseline; }
a:hover { color: #ff0000; text-decoration: underline; }

/* SMALL SCREEN FIX */
@media screen and (max-width: 600px) { 
  #title-text, #scramble { font-size: 36px !important; } 
  #content-text { font-size: 16px !important; } 
  .gallery-img { 
    /* Tuyệt chiêu Clamp (Nhỏ nhất, Mức ưu tiên co giãn, Lớn nhất) */
    width: clamp(180px, 60vw, 300px) !important; 
    height: auto !important; 
    aspect-ratio: 300 / 175; 
  }
}

/* ANIMATION FIX */
#scramble { transform: translateZ(0);
-webkit-transform: translateZ(0);
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
display: inline-block;
white-space: nowrap; }

/* SCROLL WRAPPER */
.scroll-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 5px; -ms-overflow-style: none; scrollbar-width: none; }
.scroll-wrapper::-webkit-scrollbar { display: none !important; }

/* IMG */
.gallery-img { display: inline-block; width: 300px; height: 175px; margin-right: 15px; cursor: pointer;
filter: grayscale(100%); -webkit-filter: grayscale(100%); transition: filter 0.4s ease, -webkit-filter 0.4s ease; flex-shrink: 0; vertical-align: top; 
user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: transparent; }
.gallery-img.active-center { filter: grayscale(0%); -webkit-filter: grayscale(0%); }

<!-- NEXT-PREV -->
<script>
let isSliding=false,isDragging=false,dragged=false,startX,startScroll;
const t=document.getElementById('slider-track');

// 1. Dùng getBoundingClientRect để lấy chính xác số thập phân, triệt tiêu sai số
function getImgProps() {
    const img = t.querySelector('.gallery-img');
    if (!img) return { w: 300, m: 15 };
    const style = window.getComputedStyle(img);
    return {
        w: img.getBoundingClientRect().width, 
        m: parseFloat(style.marginRight) || 0
    };
}
function getW() { const p = getImgProps(); return p.w + p.m; }
function getOffset() { return (t.getBoundingClientRect().width - getImgProps().w) / 2; }

const originalLength = t.children.length;
t.innerHTML+=t.innerHTML+t.innerHTML; 

function getSetW() { return originalLength * getW(); }
t.scrollLeft = getSetW() - getOffset(); 

function smoothScrollTo(tgt, cb) {
    const st = t.scrollLeft, chg = tgt - st, sT = performance.now();
    
    // Đệ vẫn giữ nguyên 600ms lả lướt theo ý đại ca nhé
    const duration = 600; 

    function animate(cur) {
        // TUYỆT CHIÊU Ở ĐÂY: Dùng Math.max(0, ...) ép % quãng đường (p) không bao giờ bị âm
        const p = Math.max(0, Math.min((cur - sT) / duration, 1)); 
        
        // Công thức Ease-out Quart cực mượt
        const e = 1 - Math.pow(1 - p, 4); 
        
        t.scrollLeft = st + chg * e;
        
        if (p < 1) requestAnimationFrame(animate);
        else {
            const c = t.scrollLeft, os = getOffset(), setW = getSetW();
            if (c < setW - os) t.scrollLeft += setW; 
            else if (c >= setW * 2 - os) t.scrollLeft -= setW;
            if (cb) cb();
        }
    }
    requestAnimationFrame(animate);
}
function snap(tgt){isSliding=true;smoothScrollTo(tgt,()=>isSliding=false);}

const startDrag=x=>{if(isSliding)return;isDragging=true;dragged=false;startX=x;startScroll=t.scrollLeft;};
const onDrag=x=>{if(!isDragging||isSliding)return;if(Math.abs(startX-x)>5)dragged=true;let d=startX-x,w=getW();d=d>w?w+(d-w)*0.35:d<-w?-w+(d+w)*0.35:d;t.scrollLeft=startScroll+d;};

// Đã thay thế hàm endDrag mới triệt tiêu sai số cộng dồn
const endDrag=()=>{
    if(!isDragging)return;
    isDragging=false;
    const w=getW(), os=getOffset();
    const d=t.scrollLeft-startScroll;
    let N=Math.round((startScroll+os)/w);
    if(d>35) N+=1; else if(d<-35) N-=1;
    snap(N*w-os);
};

t.addEventListener('click',e=>{if(dragged){e.preventDefault();e.stopPropagation();}},true);
t.addEventListener('touchstart',e=>startDrag(e.touches[0].pageX),{passive:true});
t.addEventListener('touchmove',e=>onDrag(e.touches[0].pageX),{passive:true});
t.addEventListener('touchend',endDrag);
t.addEventListener('mousedown',e=>startDrag(e.pageX));
t.addEventListener('mousemove',e=>{if(isDragging){e.preventDefault();onDrag(e.pageX);}});
t.addEventListener('mouseup',endDrag); t.addEventListener('mouseleave',endDrag);

function slideNext(){if(!isSliding){const os=getOffset(),w=getW(),N=Math.round((t.scrollLeft+os)/w);snap((N+1)*w-os);}}
function slidePrev(){if(!isSliding){const os=getOffset(),w=getW(),N=Math.round((t.scrollLeft+os)/w);snap((N-1)*w-os);}}

// --- PHẦN NÂNG CẤP XỊN SÒ NẰM Ở ĐÂY ---
let isResizing = false; // Cờ theo dõi trạng thái

/// 2. Tối ưu hàm quét màu (có cờ chống lag + fix chớp nháy)
function updateActiveCenter() {
    if (isResizing) return; // Đang kéo cửa sổ thì cấm chạy đoạn này để khỏi lag máy
    const os = getOffset(), w = getW();
    const activeIndex = Math.round((t.scrollLeft + os) / w);
    
    // Tìm ra index gốc thật sự (từ 0 đến originalLength - 1) 
    // Cộng thêm originalLength để phòng hờ vuốt quá nhanh sinh ra số âm
    const realIndex = (activeIndex % originalLength + originalLength) % originalLength;

    const images = t.querySelectorAll('.gallery-img');
    images.forEach((img, i) => {
        // Bật màu cho CẢ 3 BẢN SAO của cùng một tấm ảnh cùng lúc
        if (i % originalLength === realIndex) {
            img.classList.add('active-center');
        } else {
            img.classList.remove('active-center');
        }
    });
}
t.addEventListener('scroll', updateActiveCenter);

// 3. Khóa chết vị trí khi co kéo/zoom màn hình (Debounce + Tracking)
let resizeTimer;
let cachedActiveIndex = -1; // Bộ nhớ lưu vị trí tấm ảnh

window.addEventListener('resize', () => { 
    isResizing = true; // Kích hoạt cờ đang kéo cửa sổ
    clearTimeout(resizeTimer); 
    
    // BƯỚC 1: Tính chuẩn vị trí index trực tiếp bằng toán học (không dùng findIndex nữa vì giờ có 3 class active)
    if (cachedActiveIndex === -1) {
        const os = getOffset(), w = getW();
        cachedActiveIndex = Math.round((t.scrollLeft + os) / w);
    }

    // BƯỚC 2: Trong lúc kéo/zoom, ép thanh cuộn chạy theo ảnh
    if (cachedActiveIndex !== -1) {
        t.scrollLeft = cachedActiveIndex * getW() - getOffset();
    }

    // BƯỚC 3: Buông chuột/ngưng zoom 200ms thì mới reset
    resizeTimer = setTimeout(() => {
        isResizing = false; // Tắt cờ
        cachedActiveIndex = -1; // Xóa bộ nhớ
        updateActiveCenter(); // Kích hoạt lại quét màu
    }, 200); 
});

window.addEventListener('load', () => { t.scrollLeft = getSetW() - getOffset(); updateActiveCenter(); });
setTimeout(updateActiveCenter, 50);
</script>
