<style type="text/css">
/* GITHUB FONTS IMPORT */
@font-face { font-family: 'trona-bold'; src: local('Trona Bold'), local('Trona-Bold'), url('fonts/trona-bold.woff') format('woff'); }

/* PROFILE LAYOUT */
html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior: none; background-color: #000000; }
body { font-size: 16px; font-family: "Trona-bold", "Times New Roman", sans-serif; color: #ffffff; }

/* BASE RESET */
h2, ul, li { margin: 0; padding: 0; outline: 0; }
ul { list-style: none; }

/* TD & IMG FIX */
img { border: 0; display: block; }

/* ELEMENT & ICON */
a { background: transparent; text-decoration: none; color: #003399; margin: 0; padding: 0; vertical-align: baseline; }
a:hover { color: #ff0000; text-decoration: underline; }

/* SMALL SCREEN FIX */
@media screen and (max-width: 600px) { 
  #title-text, #scramble { font-size: 36px !important; } 
  #content-text { font-size: 16px !important; } 
  .gallery-img { 
    /* Tuyệt chiêu Clamp (Nhỏ nhất, Mức ưu tiên co giãn, Lớn nhất) */
    width: clamp(180px, 60vw, 300px) !important; 
    height: auto !important; 
    aspect-ratio: 300 / 175; 
  }
}

/* ANIMATION FIX */
#scramble { transform: translateZ(0);
-webkit-transform: translateZ(0);
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
display: inline-block;
white-space: nowrap; }

/* SCROLL WRAPPER */
.scroll-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 5px; -ms-overflow-style: none; scrollbar-width: none; }
.scroll-wrapper::-webkit-scrollbar { display: none !important; }

/* IMG */
.gallery-img { display: inline-block; width: 300px; height: 175px; margin-right: 15px; cursor: pointer;
filter: grayscale(100%); -webkit-filter: grayscale(100%); transition: filter 0.4s ease, -webkit-filter 0.4s ease; flex-shrink: 0; vertical-align: top; 
user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: transparent; }
.gallery-img.active-center { filter: grayscale(0%); -webkit-filter: grayscale(0%); }
</style>
</head>

<div class="scroll-wrapper">
<table width="100%" border="0" cellpadding="0" cellspacing="0" style="max-width: 600px; min-width: 300px; margin: 0 auto; table-layout: fixed;">
<tbody>

About <span id="scramble" style="color: #fff;"></span></span>

<!--IMG LIGHT BOX-->

<img id="lightbox-img" src="" style="max-width: 90%; max-height: 90%;">

<script>
function openLightbox(imageSrc) { document.getElementById('lightbox-img').src = imageSrc; document.getElementById('lightbox').style.display = 'flex'; }
</script>

<!-- NEXT-PREV -->
<script>
const viewport = document.getElementById('slider-track');

// 1. NÂNG CẤP DOM: Tự động bọc ảnh bằng thẻ Track để dùng GPU Transform
const track = document.createElement('div');
track.style.display = 'flex';
track.style.willChange = 'transform';
track.style.transformStyle = 'preserve-3d'; // Chống xé hình 
while (viewport.firstChild) track.appendChild(viewport.firstChild);
viewport.appendChild(track);
viewport.style.overflow = 'hidden'; // Khóa chết cuộn mặc định của trình duyệt

// 2. NHÂN BẢN 3 SET (Logic nguyên bản)
const originalLength = track.children.length;
track.innerHTML += track.innerHTML + track.innerHTML;
const images = track.querySelectorAll('.gallery-img');

// 3. BIẾN TRẠNG THÁI (Toàn bộ là số thập phân Float)
let w = 0, os = 0, setW = 0;
let currentX = 0; // Vị trí hiển thị thực tế
let targetX = 0;  // Vị trí người dùng muốn tới
let isDragging = false, dragged = false;
let startClientX = 0, startTargetX = 0;
let lastActiveIndex = -1;

function measure() {
    if (!images[0]) return;
    const style = window.getComputedStyle(images[0]);
    w = images[0].getBoundingClientRect().width + parseFloat(style.marginRight || 0);
    os = (viewport.getBoundingClientRect().width - images[0].getBoundingClientRect().width) / 2;
    setW = originalLength * w;
}

// 4. TRÁI TIM CỦA HỆ THỐNG: Vòng lặp Render 60 FPS
function renderLoop() {
    // A. Kéo mượt (Lerp) khi thả tay, bám dính 1:1 khi đang giữ chuột
    if (!isDragging) currentX += (targetX - currentX) * 0.08; // Hệ số 0.08 tạo độ trượt đà siêu mượt
    else currentX = targetX; 

    // B. Dịch chuyển tức thời (Teleport) khi chạm mép vòng lặp
    // Đệ nới rộng biên độ thêm (w/2) để lúc teleport không bị chớp ảnh
    if (currentX < setW - os - (w/2)) {
        currentX += setW; targetX += setW; startTargetX += setW;
    } else if (currentX > setW * 2 - os + (w/2)) {
        currentX -= setW; targetX -= setW; startTargetX -= setW;
    }

    // C. Ra lệnh cho Card đồ họa vẽ
    track.style.transform = `translate3d(${-currentX}px, 0, 0)`;

    // D. Cập nhật màu (Chỉ cập nhật khi thực sự sang tấm mới để chống lag)
    let activeIndex = Math.round((currentX + os) / w);
    let realIndex = (activeIndex % originalLength + originalLength) % originalLength;
    
    if (realIndex !== lastActiveIndex) {
        images.forEach((img, i) => {
            if (i % originalLength === realIndex) img.classList.add('active-center');
            else img.classList.remove('active-center');
        });
        lastActiveIndex = realIndex;
    }

    requestAnimationFrame(renderLoop);
}

// Khởi chạy vòng lặp
measure();
targetX = currentX = originalLength * w - os; // Bắt đầu ở trung tâm
renderLoop();

// 5. XỬ LÝ SỰ KIỆN KÉO THẢ (Hỗ trợ cả Chuột & Cảm ứng)
const onDown = e => {
    isDragging = true; dragged = false;
    startClientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    startTargetX = targetX = currentX; // Thắng gấp xe lại ngay vị trí đang trượt
    viewport.style.cursor = 'grabbing';
};

const onMove = e => {
    if (!isDragging) return;
    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const d = startClientX - clientX;
    if (Math.abs(d) > 5) dragged = true;
    targetX = startTargetX + d; // Di chuyển mục tiêu theo tay
};

const onUp = () => {
    if (!isDragging) return;
    isDragging = false;
    viewport.style.cursor = '';
    
    // Thuật toán bám dính (Snap) vào tấm gần nhất khi buông tay
    const d = targetX - startTargetX;
    let N = Math.round((targetX + os) / w);
    if (d > 35) N += 1; else if (d < -35) N -= 1;
    targetX = N * w - os;
};

viewport.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);

viewport.addEventListener('touchstart', onDown, { passive: true });
viewport.addEventListener('touchmove', onMove, { passive: true });
viewport.addEventListener('touchend', onUp);

viewport.addEventListener('click', e => { if (dragged) { e.preventDefault(); e.stopPropagation(); } }, true);

// 6. XỬ LÝ NÚT BẤM NEXT/PREV
window.slideNext = () => { targetX = Math.round((targetX + os) / w + 1) * w - os; };
window.slidePrev = () => { targetX = Math.round((targetX + os) / w - 1) * w - os; };

// 7. XỬ LÝ CO KÉO MÀN HÌNH CHỐNG VỠ GIAO DIỆN
let resizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    let currentReal = lastActiveIndex; // Ghi nhớ tấm ảnh đang xem
    resizeTimer = setTimeout(() => {
        measure();
        targetX = currentX = (originalLength + currentReal) * w - os; // Ép về lại tâm
    }, 150);
});
</script>
