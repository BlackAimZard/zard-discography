<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZARD PROFILE</title>
<meta http-equiv="Content-Style-Type" content="text/css">
<meta name="robots" content="none">
<style type="text/css">
/* GITHUB FONTS IMPORT */
@font-face {font-family: 'trona-bold'; src: url('fonts/trona-bold.woff') format('woff2');}
@font-face { font-family: 'Trona-Bold'; src: local('Trona Bold'), local('Trona-Bold'); }

/* PROFILE LAYOUT */
html, body { height: 100%; margin: 0; padding: 0; }
body { background-color: #000000; font-size: 16px; font-family: "Trona Bold", "trona-bold", "Times New Roman", sans-serif; }

/* BASE RESET */
h2, ul, li { margin: 0; padding: 0; outline: 0; }
ul { list-style: none; }

/* TD & IMG FIX */
img { border: 0; display: block; }

/* ELEMENT & ICON */
a { background: transparent; text-decoration: none; color: #003399; margin: 0; padding: 0; vertical-align: baseline; }
a:hover { color: #ff0000; text-decoration: underline; }

/* small screen text */
@media screen and (max-width: 600px) { #title-text, #scramble { font-size: 36px !important; } #content-text { font-size: 16px !important; } }

/* --- MA PHÁP CUỘN NGANG KHI MÀN HÌNH BÉ HƠN 300PX --- */
@media screen and (max-width: 300px) {
  .scroll-lock {
    width: 260px !important; /* Khóa chết chiều rộng để cố định chiều cao, chống giựt */
    overflow-x: auto !important; /* Bật tính năng cuộn ngang */
    -webkit-overflow-scrolling: touch; /* Giúp vuốt trượt trên iPhone mượt mà */
  }
  .scroll-lock::-webkit-scrollbar {
    display: none;
  }
}
  
</style>
</head>

<body>

<table width="100%" height="100%" border="0" cellpadding="0" cellspacing="0">
  <tbody>
    <tr>
      <td align="center" valign="middle">

        <table width="100%" border="0" cellpadding="10" cellspacing="0" style="max-width: 600px; margin: 0 auto;">
          <tbody>
            <tr>
              <td align="center" valign="bottom" style="padding: 0 20px 10px 20px;"> 
                <div class="scroll-lock" style="display: inline-block; text-align: left; width: 100%;">
                  <div id="title-text" style="font-size: 50px; color: #888888; line-height: 1.2; white-space: nowrap;">
                    About <span id="scramble" style="color: #FFFFFF;"></span>
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <table width="100%" border="0" cellpadding="10" cellspacing="0" style="max-width: 600px; margin: 0 auto;">
          <tbody>
            <tr>
              <td align="center" valign="top" style="padding: 10px 20px 0 20px;">
                <div class="scroll-lock" style="display: inline-block; text-align: left; width: 100%;">
                  <div id="content-text" style="font-size: 20px; color: #cccccc; line-height: 1.5; font-family: 'Times New Roman', serif;">
                    A Japanese musical unit centered around <span style="white-space: nowrap;">Izumi Sakai (坂井泉水)</span>. Even after <span style="white-space: nowrap;">Izumi Sakai's</span> passing, her works live on as timeless standards.
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        </td>
    </tr>
  </tbody>
</table>

<script src="scramble.js"></script>
<script src="small-screen-btn.js"></script>
</body>
</html>
