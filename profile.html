/* GITHUB FONTS IMPORT */

html, body { height: 100%; margin: 0; padding: 0; }
body { background-color: #000000; font-size: 16px; font-family: "Times New Roman", sans-serif; padding: 10px; box-sizing: border-box; }

img { border: 0; display: block; }
