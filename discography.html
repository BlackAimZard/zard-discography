/* ===== 1. CONTAINER ===== */

.tl-border-inner { padding: 0; border: none; }
.tl-scroll-area { width: 100%; height: 550px; background-color: transparent; overflow: hidden; position: relative; box-sizing: border-box; user-select: none; -webkit-user-select: none; -ms-user-select: none; }
.tl-header-panel { max-width: 750px; margin: 0 auto 20px auto; display: flex; align-items: center; }

/* ===== 2. HUD PANEL ===== */
.tl-hud-panel { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 50; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; flex-wrap: wrap; container-type: inline-size; container-name: hud; }

/* ===== 3. FILTER BUTTONS ===== */

.tl-sep { color: #999; margin: 0 20px; font-size: 14px; user-select: none; }
.tl-node.is-filtered { display: none !important; }

/* ===== 4. SEARCH BAR ===== */
.tl-search-inner { position: relative; width: 350px; max-width: 100%; }
@container hud (max-width: 475px) { .tl-search-inner { width: 100%; order: 2; }
.tl-btn-reset { order: 1; } }
.tl-search-input { background: #222; border: 2px solid #555; color: #fff; font-family: 'Meiryo', sans-serif; font-size: 11px; padding: 0 34px 0 10px; width: 100%; box-sizing: border-box; outline: none; height: 36px; appearance: none; -webkit-appearance: none; border-radius: 0; user-select: auto; -webkit-user-select: auto; -ms-user-select: auto; display: block; margin: 0; }
.tl-search-input::placeholder { color: #666; user-select: none; -webkit-user-select: none; -ms-user-select: none; }
.tl-search-input:focus { border-color: #fff; }
.tl-search-clear { position: absolute; right: 0; top: 0; width: 36px; height: 36px; color: #999; cursor: pointer; display: none; user-select: none; }
.tl-search-clear:hover { color: #fff; }
.tl-search-clear svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: block; }
.tl-btn-reset { width: 115px; height: 36px; flex-shrink: 0; background: #222; border: 2px solid #555; color: #999; font-family: 'Meiryo', sans-serif; font-size: 12px; cursor: pointer; box-sizing: border-box; pointer-events: auto; display: flex; align-items: center; justify-content: center; }

/* ===== 5. SEARCH DROPDOWN ===== */
.tl-dropdown { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #1C1C1C; border: 2px solid #555; max-height: 120px; overflow-y: auto; display: none; z-index: 9999; box-shadow: 0 8px 20px rgba(0,0,0,0.6); scrollbar-color: #555 #1C1C1C; scrollbar-width: thin; }
.tl-dropdown.show { display: block; }
.tl-dropdown-item { display: flex; align-items: center; padding: 6px 8px; border-bottom: 1px solid #444; cursor: pointer; gap: 12px; }

.tl-dropdown-item:hover .tl-di-title { color: #FFF; }
.tl-dropdown-item:last-child { border-bottom: none; }
.tl-dropdown-item img { width: 30px; height: 30px; object-fit: cover; flex-shrink: 0; }
.tl-di-title { flex: 1; min-width: 0; color: #AAA; font-family: 'Fix-ellipsis', 'Meiryo', sans-serif; font-size: 12px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ===== 7. TIMELINE NODES ===== */

.tl-node img { width: 38px; height: 38px; object-fit: cover; pointer-events: none; }
.tl-node.empty { border: 2px solid #666; }
.tl-node.is-hovered, .tl-node.force-hover { width: 54px; height: 54px; margin: -2px; border: 4px solid #FFF; z-index: 3; }

/* GLOBAL TOOLTIP */

.tl-panel-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
.tl-panel-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.tl-panel-title { color: #999; font-size: 11px; margin-bottom: 3px; text-align: left; overflow-wrap: break-word; word-break: break-word; }
.tl-panel-sub { color: #FFF; font-size: 14px; line-height: 1.3; text-align: left; overflow-wrap: break-word; word-break: break-word; }
.tl-panel-meta { display: flex; justify-content: space-between; padding: 12px 15px 0 15px; }
.meta-col { display: flex; flex-direction: column; gap: 3px; }
.meta-label { font-size: 11px; color: #999; text-align: left; }
.meta-value { font-size: 12px; color: #FFF; }
.tl-panel-tieup { display: none; flex-direction: column; gap: 3px; padding: 12px 15px 0 15px; text-align: left; }

<script>
document.addEventListener('DOMContentLoaded', () => {
	const TIMELINE_TYPE_CONFIG = {
		single: {
			page: 'single.html',
			name: 'Single',
			folder: 'sg',
			thumbFolder: 'sg-node-thumb'
		},
		album: {
			page: 'album.html',
			name: 'Album',
			folder: 'al',
			thumbFolder: 'al-node-thumb'
		},
		dvd: {
			page: 'dvd.html',
			name: 'DVD',
			folder: 'dvd',
			thumbFolder: 'dvd-node-thumb'
		},
		'blu-ray': {
			page: 'bluray.html',
			name: 'Blu-ray',
			folder: 'bd',
			thumbFolder: 'bd-node-thumb'
		},
		other: {
			page: 'other.html',
			name: 'Other',
			folder: 'oth',
			thumbFolder: 'oth-node-thumb'
		}
	};
	const SEARCHABLE_TIEUP_TYPES = new Set([
		'single',
		'album'
	]);

    function toText(value) {
        return value == null ? '' : String(value);
    }

    function escapeHTML(value) {
        return toText(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function flattenText(value) {
        if (Array.isArray(value)) {
            return value.flatMap(flattenText);
        }

        return typeof value === 'string' && value.trim() ? [value] : [];
    }

    function getCreditNames(credit) {
        if (typeof credit !== 'string') {
            return [];
        }

        return credit
            .split('/')
            .map(part => {
                const colonIndex = part.indexOf(':');

                return colonIndex === -1
                    ? ''
                    : part.slice(colonIndex + 1).trim();
            })
            .filter(value => {
                return (
                    value &&
                    value.toLowerCase() !== 'uncredited'
                );
            });
    }

    function getDateKey(released) {
        if (typeof released !== 'string') {
            return null;
        }

        const match = released.match(
            /^([0-9]{4})(?:\.([0-9]{2})(?:\.([0-9]{2}))?)?$/
        );

        if (!match) {
            return null;
        }

        const year = Number(match[1]);
        const month = match[2] === undefined ? null : Number(match[2]);
        const day = match[3] === undefined ? null : Number(match[3]);

        if (
            year === 0 ||
            (month !== null && (month < 1 || month > 12))
        ) {
            return null;
        }

        if (day !== null) {
            const daysInMonth = new Date(year, month, 0).getDate();

            if (day < 1 || day > daysInMonth) {
                return null;
            }
        }

        return Number(
            `${match[1]}${match[2] || '00'}${match[3] || '00'}`
        );
    }

    function getFirstReleased(item) {
        if (!item || !Array.isArray(item.releases)) {
            return '';
        }

        let firstReleased = '';
        let firstDateKey = null;

        item.releases.forEach(release => {
            const released = release && release.released;
            const dateKey = getDateKey(released);

            if (
                dateKey !== null &&
                (firstDateKey === null || dateKey < firstDateKey)
            ) {
                firstReleased = released;
                firstDateKey = dateKey;
            }
        });

        return firstReleased;
    }

    function getThumbnailSource(item) {
        const config = TIMELINE_TYPE_CONFIG[item.type];
        const id = toText(item.id);

        return config && id
            ? `assets/disc_photo/${config.folder}/${config.thumbFolder}/${id}.jpg`
            : '';
    }

    function getTimelineTitle(item) {
        const config = TIMELINE_TYPE_CONFIG[item.type];
        const type = config ? config.name : toText(item.type);
        const order = toText(item.order).trim();
        const category = toText(item.category).trim();
        const prefix = order || category;

        return [prefix, type]
            .filter(value => value)
            .join(' ');
    }

    function getLabelDisplay(item) {
        if (
            !Array.isArray(item.releases) ||
            !item.releases[0] ||
            typeof item.releases[0].catalog !== 'string'
        ) {
            return '';
        }

        return item.releases[0].catalog;
    }

    function getTieupText(item) {
        let tieupText = '';

        if (
            !item ||
            item.type !== 'single' ||
            !Array.isArray(item.tracks)
        ) {
            return tieupText;
        }

        for (const track of item.tracks) {
            if (!track || !Array.isArray(track.tieup)) {
                continue;
            }

            const firstTieup = track.tieup.find(value => {
                return typeof value === 'string';
            });

            if (firstTieup !== undefined) {
                tieupText = firstTieup;
                break;
            }
        }

        return tieupText
            .replace(/（[^（）]*）/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function getSearchText(item) {
        const trackText = Array.isArray(item.tracks)
            ? item.tracks.flatMap(track => {
                if (!track || typeof track !== 'object') return [];

                return [
                    track.title,
                    track.japaneseTitle
                ];
            })
            : [];
        const tieupText = (
            SEARCHABLE_TIEUP_TYPES.has(item.type) &&
            Array.isArray(item.tracks)
        )
            ? item.tracks.flatMap(track => {
                if (!track || typeof track !== 'object') return [];

                return flattenText(track.tieup);
            })
            : [];

        const creditText = Array.isArray(item.tracks)
            ? item.tracks.flatMap(track => {
                if (!track || typeof track !== 'object') return [];

                return getCreditNames(track.credit);
            })
            : [];

        const releasedText = Array.isArray(item.releases)
            ? item.releases.flatMap(release => {
                if (!release || typeof release !== 'object') return [];

                return [release.released];
            })
            : [];

        const catalogText = Array.isArray(item.releases)
            ? item.releases.flatMap(release => {
                if (!release || typeof release !== 'object') return [];

                return [release.catalog];
            })
            : [];

        return [
            item.order,
            item.title,
            item.japaneseTitle,
            item.released,
            ...trackText,
            ...tieupText,
            ...creditText,
            ...releasedText,
            ...catalogText
        ]
            .filter(value => value != null && value !== '')
            .join(' ')
            .toLowerCase();
    }

    function getTypeOrderSearch(item) {
        const order = toText(item.order).trim().toLowerCase();
        const type = toText(item.type).trim().toLowerCase();

        return {
            order,
            phrases: order && type
                ? [
                    `${type} ${order}`,
                    `${order} ${type}`
                ]
                : []
        };
    }

    function matchesTypeOrder(nodeSearch, keyword) {
        const query = keyword
            .trim()
            .toLowerCase()
            .replace(/\s+/g, ' ');

        if (query.split(' ').length < 2) {
            return false;
        }

        return nodeSearch.phrases.some(phrase => phrase.startsWith(query));
    }

    function createTimelineNodeHTML(item) {
        const config = TIMELINE_TYPE_CONFIG[item.type];
        const id = toText(item.id);
        const thumb = getThumbnailSource(item);
		const tooltipThumb = config && id
			? `assets/disc_photo/${config.folder}/${id}.jpg`
			: '';
        const title = toText(item.title);
        const no = getTimelineTitle(item);
        const tooltipTieup = item.type === 'single'
            ? getTieupText(item)
            : '';
        const href = config && id
            ? `${config.page}#${encodeURIComponent(id)}`
            : '#';
        const imageHTML = thumb
            ? `<img src="${escapeHTML(thumb)}" alt="" draggable="false">`
            : '';

        return `
            <a href="${escapeHTML(href)}"
                class="tl-node${thumb ? '' : ' empty'}"
                data-id="${escapeHTML(id)}"
                data-type="${escapeHTML(item.type)}"
                data-thumb="${escapeHTML(tooltipThumb)}"
                data-title="${escapeHTML(no)}"
                data-sub="${escapeHTML(title)}"
                data-released="${escapeHTML(item.released)}"
                data-label="${escapeHTML(getLabelDisplay(item))}"
                data-tieup="${escapeHTML(tooltipTieup)}">${imageHTML}</a>
        `;
    }

    function createTimelineHTML(items) {
        const yearGroups = new Map();

        items.forEach(item => {
            const year = item.released.slice(0, 4);

            if (!yearGroups.has(year)) {
                yearGroups.set(year, []);
            }

            yearGroups.get(year).push(item);
        });

        const columnsHTML = Array.from(yearGroups, ([year, yearItems]) => `
            <div class="tl-col">
                <div class="tl-year-text">${year}</div>
                <div class="tl-nodes-container">
                    ${yearItems.map(createTimelineNodeHTML).join('')}
                </div>
            </div>
        `).join('');

        return `<div class="tl-grid">${columnsHTML}</div>`;
    }

    /* TIMELINE DATA LOADER */
    const dragContainer = document.getElementById('timeline-drag');
    const singleItems = (
        typeof SINGLE_DATA !== 'undefined' &&
        Array.isArray(SINGLE_DATA)
    )
        ? SINGLE_DATA.filter(item => item && item.type === 'single')
        : [];
    const albumItems = (
        typeof ALBUM_DATA !== 'undefined' &&
        Array.isArray(ALBUM_DATA)
    )
        ? ALBUM_DATA.filter(item => item && item.type === 'album')
        : [];
    const dvdItems = (
        typeof DVD_DATA !== 'undefined' &&
        Array.isArray(DVD_DATA)
    )
        ? DVD_DATA.filter(item => item && item.type === 'dvd')
        : [];
    const blurayItems = (
        typeof BLURAY_DATA !== 'undefined' &&
        Array.isArray(BLURAY_DATA)
    )
        ? BLURAY_DATA.filter(item => item && item.type === 'blu-ray')
        : [];
    const otherItems = (
        typeof OTHER_DATA !== 'undefined' &&
        Array.isArray(OTHER_DATA)
    )
        ? OTHER_DATA.filter(item => item && item.type === 'other')
        : [];
    const timelineItems = [
        ...singleItems,
        ...albumItems,
        ...dvdItems,
        ...blurayItems,
        ...otherItems
    ]
        .map(item => ({
            ...item,
            released: getFirstReleased(item)
        }))
        .filter(item => item && getDateKey(item.released) !== null)
        .sort((a, b) => getDateKey(a.released) - getDateKey(b.released));
    const timelineSearchMap = new Map(
        timelineItems.map(item => [
            toText(item.id),
            {
                text: getSearchText(item),
                ...getTypeOrderSearch(item)
            }
        ])
    );

    if (timelineItems.length === 0) {
        dragContainer.innerHTML = '';
        return;
    }

    dragContainer.innerHTML = createTimelineHTML(timelineItems);

    /* TOOLTIP DOM SETUP */
    const tooltip = document.getElementById('global-tooltip');
    const borderOuter = dragContainer.closest('.tl-border-outer');
    borderOuter.appendChild(tooltip);
    tooltip.style.position = 'absolute';

    let activeHoveredNode = null;
	let isSearchPinned = false;

    /* PANZOOM ENGINE INITIALIZATION */
    const zoomTarget = dragContainer.firstElementChild; 
    const containerRect = dragContainer.getBoundingClientRect();
    let defaultZoom = 0.5; 

    const pz = panzoom(zoomTarget, {
        maxZoom: 3, 
        minZoom: 0.2,
        initialZoom: defaultZoom, 
        bounds: false, 
        boundsPadding: 0.1,
        smoothScroll: false
    });

    const contentHeight = zoomTarget.offsetHeight * defaultZoom;
    const startX = 0; 
    const startY = (containerRect.height - contentHeight) / 2;
    pz.moveTo(startX, startY);
    
	/* MAP RESET HANDLER */
	document.getElementById('tl-reset-btn').addEventListener('click', resetTimelineState);

    /* LOCAL COORDINATES HELPER */
    function getLocalCoords(element, target) {
        let x = 0;
        let y = 0;
        let curr = element;
        while (curr && curr !== target) {
            x += curr.offsetLeft;
            y += curr.offsetTop;
            curr = curr.offsetParent;
        }
        return { x, y };
    }

    /* GLOBAL MOUSE DRAG RADAR */
    let isGlobalMouseDown = false;
    let isGlobalDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    document.addEventListener('mousedown', (e) => {
        isGlobalMouseDown = true;
        isGlobalDragging = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
    });

    document.addEventListener('mousemove', (e) => {
        if (!isGlobalMouseDown) return;
        const distance = Math.sqrt(Math.pow(e.clientX - dragStartX, 2) + Math.pow(e.clientY - dragStartY, 2));
        if (distance > 3) { 
            isGlobalDragging = true;
        }
    });

    document.addEventListener('mouseup', () => {
        isGlobalMouseDown = false;
        isGlobalDragging = false;
    });

	/* TOOLTIP INTERACTION ENGINE */
	const nodesWithData = document.querySelectorAll('.tl-node[data-title]');

	nodesWithData.forEach(node => {
		node.addEventListener('pointerenter', (e) => {
			if (e.pointerType !== 'mouse') return;
			if (isGlobalDragging && !node.classList.contains('force-hover')) return;

			activeHoveredNode = node;
			node.classList.add('is-hovered');

			updateTooltipContent(node);
			updateMagneticTooltip();
		});

		node.addEventListener('pointerleave', (e) => {
			if (e.pointerType !== 'mouse') return;

			activeHoveredNode = null;
			node.classList.remove('is-hovered');

			if (!node.classList.contains('force-hover')) {
				tooltip.style.display = 'none';
			}
		});
	});

    /* RENDER TOOLTIP CONTENT */
    function updateTooltipContent(node) {
        const tooltipImage = document.getElementById('tt-img');

        if (node.dataset.thumb) {
            tooltipImage.src = node.dataset.thumb;
            tooltipImage.style.display = '';
        } else {
            tooltipImage.removeAttribute('src');
            tooltipImage.style.display = 'none';
        }

        document.getElementById('tt-title').textContent = node.dataset.title;
        document.getElementById('tt-sub').textContent = node.dataset.sub;
        document.getElementById('tt-released').textContent = node.dataset.released;
        document.getElementById('tt-label').textContent = node.dataset.label;

        const tieupContainer = document.getElementById('tt-tieup-container');
        if (node.dataset.type === 'single' && node.dataset.tieup) {
            document.getElementById('tt-tieup').textContent = node.dataset.tieup;
            tieupContainer.style.display = 'flex'; 
        } else {
            tieupContainer.style.display = 'none';
        }
    }

	/* MAGNETIC TOOLTIP POSITIONING */
	let tooltipFrame;

	function updateMagneticTooltip() {
		cancelAnimationFrame(tooltipFrame);
    
		tooltipFrame = requestAnimationFrame(() => {
			const forcedNode = document.querySelector('.force-hover');
			const currentNode = activeHoveredNode || forcedNode;

			if (currentNode) {
				const t = pz.getTransform();
				const dragRect = dragContainer.getBoundingClientRect();
				const oRect = borderOuter.getBoundingClientRect();
				const dl = dragRect.left - oRect.left;
				const dt = dragRect.top - oRect.top;

				const local = getLocalCoords(currentNode, zoomTarget);
				let targetLeft = (local.x + currentNode.offsetWidth) * t.scale + t.x + dl + 20;
				let targetTop = local.y * t.scale + t.y + dt - 15;

				if (targetLeft < 15) targetLeft = 15;
				if (targetTop < 15) targetTop = 15;

				tooltip.style.left = targetLeft + 'px';
				tooltip.style.top = targetTop + 'px';
				tooltip.style.display = 'block';
			} else {
				tooltip.style.display = 'none'; 
			}
		});
	}
    
    pz.on('pan', updateMagneticTooltip);
    pz.on('zoom', updateMagneticTooltip);
    
	/* SEARCH & FILTER ENGINE */
	const searchInput = document.getElementById('tl-search-box');
	const searchDropdown = document.getElementById('tl-search-dropdown');
	const filterBtns = document.querySelectorAll('.tl-filter-btn');
	const searchClearBtn = document.getElementById('tl-search-clear');

	/* PANZOOM NODE FOCUS HELPER */
	function focusNodeOnMap(node) {
		const targetScale = 1;
		const containerRect = dragContainer.getBoundingClientRect();
		const currentTransform = pz.getTransform();
		const nodeRect = node.getBoundingClientRect();

		const nodeScreenX = nodeRect.left + nodeRect.width / 2;
		const nodeScreenY = nodeRect.top + nodeRect.height / 2;

		const nodeLocalX = (nodeScreenX - containerRect.left - currentTransform.x) / currentTransform.scale;
		const nodeLocalY = (nodeScreenY - containerRect.top - currentTransform.y) / currentTransform.scale;

		const targetX = containerRect.width / 2 - nodeLocalX * targetScale;
		const targetY = containerRect.height / 2 - nodeLocalY * targetScale;

		pz.zoomAbs(0, 0, targetScale);
		pz.moveTo(targetX, targetY);
	}

	/* EXECUTE SEARCH */
	function runSearch() {
		const keyword = searchInput.value.toLowerCase().trim();
		const allMusicNodes = document.querySelectorAll('.tl-node[data-title]');
		const activeFilterBtn = document.querySelector('.tl-filter-btn.active');
		const currentFilter = activeFilterBtn ? activeFilterBtn.dataset.filter : 'all';

		searchDropdown.innerHTML = '';
		searchClearBtn.style.display = keyword.length > 0 ? 'block' : 'none';

		allMusicNodes.forEach(node => node.classList.remove('is-searched'));

		if (keyword.length < 2) {
			searchDropdown.classList.remove('show');
			return;
		}

		const matchedNodes = [];

		allMusicNodes.forEach((node, index) => {
			const isMatchFilter = currentFilter === 'all' || node.dataset.type === currentFilter;
			if (!isMatchFilter) return;

			const nodeSearch = timelineSearchMap.get(node.dataset.id) || {
				text: '',
				order: '',
				phrases: []
			};
			const isTypeOrderMatch = matchesTypeOrder(nodeSearch, keyword);

			if (nodeSearch.text.includes(keyword) || isTypeOrderMatch) {
				node.classList.add('is-searched');
				matchedNodes.push({ node, index });
			}
		});

		if (matchedNodes.length === 0) {
			searchDropdown.innerHTML = '<div class="tl-dropdown-empty">No matching info.</div>';
			searchDropdown.classList.add('show');
			return;
		}

		allMusicNodes.forEach(node => node.classList.remove('force-hover'));

		let dropdownHTML = '';

		matchedNodes.forEach(match => {
			const node = match.node;
			const innerImg = node.querySelector('img');
			const imgSrc = innerImg ? innerImg.getAttribute('src') : '';
			const dropdownImageHTML = imgSrc
				? `<img src="${escapeHTML(imgSrc)}" alt="" draggable="false">`
				: '';

			dropdownHTML += `
				<div class="tl-dropdown-item" data-index="${match.index}">
					${dropdownImageHTML}
					<span class="tl-di-title">${escapeHTML(node.dataset.sub)}</span>
					<span class="tl-di-date">${escapeHTML(node.dataset.released)}</span>
				</div>
			`;
		});

		searchDropdown.innerHTML = dropdownHTML;
		searchDropdown.classList.add('show');

		const firstNode = matchedNodes[0].node;

		firstNode.classList.add('force-hover');
		activeHoveredNode = firstNode;
		isSearchPinned = true;

		focusNodeOnMap(firstNode);
		updateTooltipContent(firstNode);
		updateMagneticTooltip();

		searchDropdown.querySelectorAll('.tl-dropdown-item').forEach(item => {
			item.addEventListener('click', function(e) {
				e.preventDefault();

				const targetNode = allMusicNodes[this.getAttribute('data-index')];

				allMusicNodes.forEach(node => node.classList.remove('force-hover'));

				targetNode.classList.add('force-hover');
				activeHoveredNode = targetNode;
				isSearchPinned = true;

				focusNodeOnMap(targetNode);
				updateTooltipContent(targetNode);
				updateMagneticTooltip();

				searchDropdown.classList.remove('show');
			});
		});
	}

	searchInput.addEventListener('input', runSearch);

	function updateTimelineColumns() {
		document.querySelectorAll('.tl-col').forEach(column => {
			const hasVisibleNode = column.querySelector('.tl-node:not(.is-filtered)');
			column.classList.toggle('is-empty', !hasVisibleNode);
		});
	}

    /* FILTER BUTTON CLICK LISTENER */
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filterType = btn.dataset.filter;
            
            document.querySelectorAll('.tl-node[data-type]').forEach(node => {
                node.classList.toggle('is-filtered', filterType !== 'all' && node.dataset.type !== filterType);
            });

			updateTimelineColumns();
            
            const currentPinnedNode = document.querySelector('.force-hover');
            if (currentPinnedNode && currentPinnedNode.classList.contains('is-filtered')) {
                currentPinnedNode.classList.remove('force-hover');
                tooltip.style.display = 'none';
                activeHoveredNode = null;
				isSearchPinned = false;
            }
            
            runSearch();
            
            setTimeout(() => {
                if (document.querySelector('.force-hover') || activeHoveredNode) {
                    updateMagneticTooltip();
                }
            }, 10);
        });
    });

    /* SEARCH CLEAR BUTTON */
    searchClearBtn.addEventListener('click', () => {
        searchInput.value = ''; 
        runSearch(); 
        searchInput.focus(); 
    });
	
	/* TIMELINE STATE RESET */
	function resetTimelineState() {
		cancelAnimationFrame(tooltipFrame);

		document.querySelectorAll('.tl-node').forEach(node => {
			node.classList.remove(
				'force-hover',
				'is-hovered',
				'is-searched',
				'is-filtered'
			);
		});

		updateTimelineColumns();

		tooltip.style.display = 'none';
		tooltip.style.left = '';
		tooltip.style.top = '';

		activeHoveredNode = null;
		isSearchPinned = false;
		isGlobalMouseDown = false;
		isGlobalDragging = false;

		searchInput.value = '';
		searchInput.blur();

		searchClearBtn.style.display = 'none';

		searchDropdown.innerHTML = '';
		searchDropdown.classList.remove('show');

		filterBtns.forEach(btn => {
			btn.classList.toggle('active', btn.dataset.filter === 'all');
		});

		pz.zoomAbs(0, 0, defaultZoom);
		pz.moveTo(startX, startY);
	}

	/* GLOBAL EVENT HANDLERS */
	const isTouchLikePointer = pointerType => {
		return pointerType === 'touch' || pointerType === 'pen';
	};

	document.querySelectorAll('.tl-node').forEach(node => {
		node.addEventListener('pointerenter', (e) => {
			if (e.pointerType !== 'mouse' || isGlobalDragging) return;

			document.querySelectorAll('.force-hover').forEach(n => n.classList.remove('force-hover'));
			isSearchPinned = false;
		});

		let pointerStartX = 0;
		let pointerStartY = 0;
		let pointerDistance = 0;
		let pointerType = null;

		node.addEventListener('pointerdown', (e) => {
			pointerStartX = e.clientX;
			pointerStartY = e.clientY;
			pointerDistance = 0;
			pointerType = e.pointerType;
		});

		node.addEventListener('pointerup', (e) => {
			pointerDistance = Math.hypot(
				e.clientX - pointerStartX,
				e.clientY - pointerStartY
			);

			if (!isTouchLikePointer(pointerType)) return;
			if (pointerDistance > 10) return;

			if (e.cancelable) e.preventDefault();
			if (!node.hasAttribute('data-title')) return;

			if (!node.classList.contains('force-hover')) {
				document.querySelectorAll('.force-hover').forEach(n => n.classList.remove('force-hover'));

				isSearchPinned = false;
				node.classList.add('force-hover');
				activeHoveredNode = node;

				updateTooltipContent(node);
				updateMagneticTooltip();
			} else {
				const link = node.getAttribute('href');

				if (link && link !== '#') {
					window.location.href = link;
				}
			}
		});

		node.addEventListener('pointercancel', () => {
			pointerType = null;
			pointerDistance = Infinity;
		});

		node.addEventListener('click', (e) => {
			const currentPointerType = pointerType;
			const currentDistance = pointerDistance;

			pointerType = null;
			pointerDistance = 0;

			if (isTouchLikePointer(currentPointerType)) {
				e.preventDefault();
				return;
			}

			if (currentDistance > 1) {
				e.preventDefault();
				return;
			}

			const link = node.getAttribute('href');

			if (link && link !== '#') {
				return;
			}

			document.querySelectorAll('.force-hover').forEach(n => n.classList.remove('force-hover'));
			isSearchPinned = false;
			node.classList.add('force-hover');
		});
	});

	/* WINDOW RESIZE HANDLER */
	window.addEventListener('pageshow', resetTimelineState);
	window.addEventListener('resize', updateMagneticTooltip, { passive: true });

	document.addEventListener('click', (e) => {
		if (!e.target.closest('.tl-search-inner')) {
			searchDropdown.classList.remove('show');
		}
	});

	/* GLOBAL DISMISS HANDLER */
	function handleTouchLikeDismiss(e, startX, startY, endX, endY, searchWasFocused) {
		if (Math.hypot(endX - startX, endY - startY) > 10) return;

		const isSearch = e.target.closest('.tl-search-inner');
		const isFilter = e.target.closest('.tl-filter-btn');
		const isNode = e.target.closest('.tl-node');
		const isTooltip = e.target.closest('.tl-global-tooltip');
		const isOutside = !isSearch && !isFilter && !isNode && !isTooltip;

		if (!isSearch) {
			searchDropdown.classList.remove('show');
			searchInput.blur();
		}

		if (!isOutside) return;

		if (isSearchPinned && searchWasFocused) {
			return;
		}

		document.querySelectorAll('.force-hover').forEach(n => n.classList.remove('force-hover'));
		tooltip.style.display = 'none';
		activeHoveredNode = null;
		isSearchPinned = false;
	}

	let globalTouchStartX = 0;
	let globalTouchStartY = 0;
	let touchStartedWithSearchFocus = false;

	document.addEventListener('touchstart', (e) => {
		globalTouchStartX = e.changedTouches[0].screenX;
		globalTouchStartY = e.changedTouches[0].screenY;
		touchStartedWithSearchFocus = document.activeElement === searchInput;
	}, { capture: true, passive: true });

	document.addEventListener('touchend', (e) => {
		const touch = e.changedTouches[0];

		handleTouchLikeDismiss(
			e,
			globalTouchStartX,
			globalTouchStartY,
			touch.screenX,
			touch.screenY,
			touchStartedWithSearchFocus
		);

		touchStartedWithSearchFocus = false;
	}, { capture: true, passive: true });

	let globalPenStartX = 0;
	let globalPenStartY = 0;
	let penStartedWithSearchFocus = false;

	document.addEventListener('pointerdown', (e) => {
		if (e.pointerType !== 'pen') return;

		globalPenStartX = e.clientX;
		globalPenStartY = e.clientY;
		penStartedWithSearchFocus = document.activeElement === searchInput;
	}, { capture: true, passive: true });

	document.addEventListener('pointerup', (e) => {
		if (e.pointerType !== 'pen') return;

		handleTouchLikeDismiss(
			e,
			globalPenStartX,
			globalPenStartY,
			e.clientX,
			e.clientY,
			penStartedWithSearchFocus
		);

		penStartedWithSearchFocus = false;
	}, { capture: true, passive: true });

	/* SEARCH DROPDOWN RE-OPEN HANDLERS */
	searchInput.addEventListener('click', () => {
		if (searchInput.value.trim().length >= 2 && searchDropdown.children.length > 0) {
			searchDropdown.classList.add('show');
		}
	});

	searchInput.addEventListener('focus', () => {
		if (searchInput.value.trim().length >= 2 && searchDropdown.children.length > 0) {
			searchDropdown.classList.add('show');
		}
	});
	});
</script>
</div>
</body>
</html>
