<!DOCTYPE html>
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta name="robots" content="none">

<title>Home</title>
<style type="text/css">
/* FONTS IMPORT */
@font-face { font-family: 'trona-bold'; src: local('Trona Bold'), local('trona-Bold'), url('fonts/trona-bold.woff') format('woff'); font-display: swap; }

/* PROFILE LAYOUT */
html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior: none; background-color: #000000; overflow: hidden; }
body { font-size: 16px; font-family: "trona-bold", "Times New Roman", sans-serif; color: #ffffff; }
.x-axis-lock { 
    width: 100%; height: 100%; 
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -ms-overflow-style: none; 
	overscroll-behavior: none;
}
.y-axis-lock { 
    width: fit-content; min-width: 100%; height: 100%; 
    overflow-x: hidden; overflow-y: auto;
    scrollbar-width: none; -ms-overflow-style: none; 
	overscroll-behavior: none;
}
.x-axis-lock::-webkit-scrollbar, .y-axis-lock::-webkit-scrollbar { display: none; }

/* BASE RESET */
h2, ul, li { margin: 0; padding: 0; outline: 0; }
ul { list-style: none; }

/* TD & IMG FIX */
img { border: 0; display: block; }

/* ELEMENT & ICON */
a { background: transparent; text-decoration: none; color: #003399; margin: 0; padding: 0; vertical-align: baseline; }
a:hover { color: #ff0000; text-decoration: underline; }

/* ANIMATION FIX */
#scramble { transform: translateZ(0); -webkit-transform: translateZ(0); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: inline-block; white-space: nowrap; }

/* SCROLL WRAPPER */
.scroll-wrapper { width: 100%; padding-bottom: 5px; }
.scroll-wrapper::-webkit-scrollbar { display: none !important; }

/* EMBLA CAROUSEL */
.embla { width: 100%; overflow: hidden; opacity: 0; transition: opacity 0.4s ease-in; }
.embla.is-ready { opacity: 1; }
.embla__container { display: flex; touch-action: pan-y; margin: 0; }
.embla__slide { flex: 0 0 64%; min-width: 0; margin-right: 20px; }
.embla__slide .gallery-img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; cursor: pointer; filter: grayscale(100%); transition: filter 0.8s ease; user-select: none; -webkit-user-drag: none; }
.is-colored .gallery-img { filter: grayscale(0%); -webkit-filter: grayscale(0%); }

/* NAV ARROW BUTTONS */
.nav-arrow { color: #888; cursor: pointer; transition: color 0.3s; display: flex; align-items: center; }
@media (hover: hover) and (pointer: fine) { .nav-arrow:hover { color: #fff; } }
.nav-arrow:active { color: #fff; transition: none; }

/* TIMELINE MAP CONTAINER */
.tl-border-outer { max-width: 650px; margin: 0 auto; border: 2px solid #555; box-sizing: border-box; position: relative; background-color: #191919; user-select: none; -webkit-user-select: none; -ms-user-select: none;}
.tl-border-inner { padding: 0; border: none; }
.tl-scroll-area { width: 100%; height: 550px; background-color: transparent; overflow: hidden; position: relative; box-sizing: border-box; user-select: none; -webkit-user-select: none; -ms-user-select: none; }

/* HUD UI PANEL */
.tl-hud-panel { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 50; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
.tl-search-inner, .tl-filter-group { pointer-events: auto; } 
.tl-ui-bottom-left { position: absolute; bottom: 15px; left: 15px; z-index: 50; color: #888; font-family: 'Times New Roman', serif; font-size: 12px; pointer-events: none; user-select: none; }

/* FLAT GROUPED BUTTONS */
.tl-filter-group { display: flex; border: 2px solid #555; background: #292929; box-sizing: border-box; height: 38px; }
.tl-filter-btn { flex: 1; min-width: 75px; background: transparent; border: none; border-right: 2px solid #555; color: #888; font-family: 'Times New Roman', serif; font-size: 12px; font-weight: bold; cursor: pointer; padding: 0 10px; line-height: 34px; text-align: center; transition: background 0.2s, color 0.2s; box-sizing: border-box; }
.tl-filter-btn:last-child { border-right: none; }
.tl-filter-btn:hover { color: #fff; }
.tl-filter-btn.active { background: #d49a3a; color: #111; pointer-events: none; }
.tl-node.is-filtered { display: none !important; }

/* SEARCH BAR */
.tl-search-inner { position: relative; width: 100%; max-width: 330px; }
.tl-search-input { background: #292929; border: 2px solid #555; color: #fff; font-family: 'Times New Roman', serif; font-size: 12px; padding: 0 35px 0 15px; line-height: 34px; width: 100%; box-sizing: border-box; outline: none; transition: border-color 0.2s; height: 38px; -webkit-appearance: none; border-radius: 0; user-select: auto; -webkit-user-select: auto; -ms-user-select: auto;}
.tl-search-input::placeholder { color: #888; user-select: none; -webkit-user-select: none; -ms-user-select: none; }
.tl-search-input:focus { border-color: #fff; }
.tl-search-clear { position: absolute; right: 0; top: 0; width: 38px; height: 38px; color: #888; cursor: pointer; display: none; user-select: none; }
.tl-search-clear:hover { color: #fff; }
.tl-search-clear svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: block; }

/* SEARCH DROPDOWN */
.tl-dropdown { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #1c1c1c; border: 2px solid #555; max-height: 250px; overflow-y: auto; display: none; z-index: 9999; box-shadow: 0 8px 20px rgba(0,0,0,0.8); }
.tl-dropdown.show { display: block; }
.tl-dropdown-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-bottom: 1px solid #333; cursor: pointer; transition: background 0.1s; }
.tl-dropdown-item:hover { background: #333; }
.tl-di-left { display: flex; align-items: center; gap: 12px; }
.tl-di-left img { width: 32px; height: 32px; object-fit: cover; border: 1px solid #444; }
.tl-di-left span { color: #ddd; font-family: 'Times New Roman', serif; font-size: 12px; text-align: left; }
.tl-di-right { color: #888; font-family: 'Times New Roman', serif; font-size: 12px; }
.tl-node.is-searched { outline: 2px dashed #00ffff !important; outline-offset: 4px; z-index: 4; }
.tl-dropdown::-webkit-scrollbar { width: 6px; }
.tl-dropdown::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

/* GRID COLUMNS */
.tl-grid { display: flex; gap: 50px; padding: 30px; min-width: max-content; }
.tl-col { display: flex; flex-direction: column; align-items: center; width: 50px; }
.tl-year-text { font-size: 16px; color: #aaa; font-family: 'Times New Roman', serif; margin-bottom: 20px; user-select: none; }
.tl-nodes-container { display: flex; flex-direction: column; gap: 30px; position: relative; }
.tl-nodes-container::before { content: ''; position: absolute; top: 2px; bottom: 2px; left: 50%; transform: translateX(-50%); width: 2px; background-color: #555; z-index: 1; }

/* TIMELINE NODES */
.tl-node { width: 50px; height: 50px; margin: 0; box-sizing: border-box; border: 2px solid #555; background-color: #292929; display: flex; justify-content: center; align-items: center; z-index: 2; position: relative; text-decoration: none; color: transparent; }
.tl-node img { width: 38px; height: 38px; object-fit: cover; pointer-events: none; }
.tl-node.empty { border: 2px solid #444; }
.tl-node.is-hovered, .tl-node.force-hover { width: 54px; height: 54px; margin: -2px; border: 4px solid #ddd; z-index: 3; }

/* GLOBAL TOOLTIP */
.tl-global-tooltip { display: none; position: fixed; width: 250px; background-color: #161616; border: 2px solid #555; padding: 15px; z-index: 99999; box-shadow: 0 4px 20px rgba(0,0,0,0.9); pointer-events: none; font-family: 'Times New Roman', serif; }
.tl-panel-top { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; }
.tl-panel-img-box { width: 80px; height: 80px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
.tl-panel-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
.tl-panel-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.tl-panel-title { color: #888; font-size: 14px; margin-bottom: 6px; text-align: left; overflow-wrap: break-word; word-break: break-word; }
.tl-panel-sub { color: #ddd; font-size: 16px; line-height: 1.3; text-align: left; overflow-wrap: break-word; word-break: break-word; }
.tl-panel-meta { display: flex; justify-content: space-between; border-top: 1px solid #444; padding-top: 14px; }
.meta-col { display: flex; flex-direction: column; gap: 6px; }
.meta-label { font-size: 12px; color: #888; text-align: left; }
.meta-value { font-size: 14px; color: #ddd; }
.tl-panel-tieup { display: none; flex-direction: column; gap: 6px; padding-top: 12px; text-align: left; }

/* SMALL SCREEN FIX */
@media (hover: hover) and (pointer: fine) { html, body { overflow: auto; } .x-axis-lock, .y-axis-lock { display: contents; } }
@media screen and (max-width: 650px) { .main-wrapper { padding-left: 20px !important; padding-right: 20px !important; } }
@media screen and (max-width: 600px) { #title-text, #scramble { font-size: 36px !important; } 
#content-text { font-size: 16px !important;  }
.embla { width: calc(100% + 40px) !important; margin-left: -20px !important; } }
/* HUD RESPONSIVE  */
@media screen and (max-width: 600px) {
.tl-hud-panel { flex-direction: column-reverse !important; align-items: flex-start !important; text-align: left !important; gap: 10px !important; }
.tl-search-input { 
    font-size: 16px !important; 
    width: 133.33% !important; /* 100% / 0.75 */
    height: 50.66px !important; /* 38px / 0.75 */
    line-height: 45.33px !important; /* 34px / 0.75 */
    padding: 0 40px 0 20px !important; /* Bơm lề */
    transform: scale(0.75) !important; /* Ép về đúng kích thước thực tế 12px */
    transform-origin: top left !important; 
}
.tl-search-inner { max-width: 100% !important; width: 100% !important; margin-top: 0px !important; }
.tl-filter-group { display: flex !important; width: -webkit-max-content !important; width: max-content !important; align-self: flex-start !important; margin: 0 !important; } 
.tl-filter-btn { flex: none !important; } }
</style>
</head>

<!-- CAROUSEL INIT -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const emblaNode = document.getElementById('embla-slider');
    const emblaApi = EmblaCarousel(emblaNode, { align: 'center', loop: true, skipSnaps: true, dragFree: false });

    document.getElementById('btn-prev').addEventListener('click', () => emblaApi.scrollPrev());
    document.getElementById('btn-next').addEventListener('click', () => emblaApi.scrollNext());

    const slides = emblaApi.slideNodes();
    const applyColor = () => {
        const selected = emblaApi.selectedScrollSnap();
        slides.forEach((slide, i) => {
            i === selected ? slide.classList.add('is-colored') : slide.classList.remove('is-colored');
        });
    };

    const captionNode = document.getElementById('slide-caption');
    let captionTimeout = null;

    const showCaptionFast = () => {
        clearTimeout(captionTimeout);
        captionNode.style.opacity = '0';
        
        captionTimeout = setTimeout(() => {
            const currentSlide = slides[emblaApi.selectedScrollSnap()];
            captionNode.textContent = currentSlide.getAttribute('data-caption') || '';
            captionNode.style.opacity = '1'; 
        }, 300); 
    };

    emblaApi.on('init', () => { 
        emblaNode.classList.add('is-ready'); 
        applyColor(); 
        const firstSlide = slides[emblaApi.selectedScrollSnap()];
        captionNode.textContent = firstSlide.getAttribute('data-caption') || '';
        captionNode.style.opacity = '1';
    });
        
    emblaApi.on('select', () => {
        applyColor();
        showCaptionFast();
    });

    emblaNode.addEventListener('click', (e) => {
        if (!e.target.classList.contains('gallery-img')) return;
        const slide = e.target.closest('.embla__slide');
        if (!slide) return;
        
        const index = slides.indexOf(slide);
        if (index === emblaApi.selectedScrollSnap()) {
            openLightbox(e.target.getAttribute('data-lightbox'));
        } else {
            emblaApi.scrollTo(index);
        }
    });
});
</script>

<script>
<script src="timeline-data.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    /* TIMELINE DATA LOADER */
    const dragContainer = document.getElementById('timeline-drag');
    
    if (typeof TIMELINE_HTML !== 'undefined') {
        dragContainer.innerHTML = TIMELINE_HTML;
    } else {
        dragContainer.innerHTML = "";
        return; 
    }

    /* TOOLTIP DOM SETUP */
    const tooltip = document.getElementById('global-tooltip');
    const borderOuter = dragContainer.closest('.tl-border-outer');
    borderOuter.appendChild(tooltip);
    tooltip.style.position = 'absolute';

    let activeHoveredNode = null;

    /* PANZOOM ENGINE INITIALIZATION */
    const zoomTarget = dragContainer.firstElementChild; 
    const containerRect = dragContainer.getBoundingClientRect();
    let defaultZoom = 0.5; 

    const pz = panzoom(zoomTarget, {
        maxZoom: 3, 
        minZoom: 0.2,
        initialZoom: defaultZoom, 
        bounds: true, 
        boundsPadding: 0.1,
        smoothScroll: false
    });

    const contentHeight = zoomTarget.offsetHeight * defaultZoom;
    const startX = 0; 
    const startY = (containerRect.height - contentHeight) / 2;
    pz.moveTo(startX, startY);

    /* LOCAL COORDINATES HELPER */
    function getLocalCoords(element, target) {
        let x = 0;
        let y = 0;
        let curr = element;
        while (curr && curr !== target) {
            x += curr.offsetLeft;
            y += curr.offsetTop;
            curr = curr.offsetParent;
        }
        return { x, y };
    }

    /* GLOBAL MOUSE DRAG RADAR */
    let isGlobalMouseDown = false;
    let isGlobalDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    document.addEventListener('mousedown', (e) => {
        isGlobalMouseDown = true;
        isGlobalDragging = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
    });

    document.addEventListener('mousemove', (e) => {
        if (!isGlobalMouseDown) return;
        const distance = Math.sqrt(Math.pow(e.clientX - dragStartX, 2) + Math.pow(e.clientY - dragStartY, 2));
        /* REQUIRE >3PX MOVEMENT TO REGISTER AS DRAG */
        if (distance > 3) { 
            isGlobalDragging = true;
        }
    });

    document.addEventListener('mouseup', () => {
        isGlobalMouseDown = false;
        isGlobalDragging = false;
    });

    /* TOOLTIP INTERACTION ENGINE */
    const nodesWithData = document.querySelectorAll('.tl-node[data-title]');

    nodesWithData.forEach(node => {
        node.addEventListener('mouseenter', (e) => {
            /* PREVENT HOVER EFFECTS WHILE DRAGGING (EXCEPT PINNED NODES) */
            if (isGlobalDragging && !node.classList.contains('force-hover')) return;

            activeHoveredNode = node;
            node.classList.add('is-hovered'); 
            updateTooltipContent(node);
            updateMagneticTooltip();
        });

        node.addEventListener('mouseleave', () => { 
            activeHoveredNode = null;
            node.classList.remove('is-hovered'); 
            
            /* HIDE TOOLTIP IMMEDIATELY IF NOT PINNED */
            if (!node.classList.contains('force-hover')) {
                tooltip.style.display = 'none'; 
            }
        });
    });

    /* RENDER TOOLTIP CONTENT */
    function updateTooltipContent(node) {
        document.getElementById('tt-img').src = node.dataset.thumb;
        document.getElementById('tt-title').textContent = node.dataset.title;
        document.getElementById('tt-sub').textContent = node.dataset.sub;
        document.getElementById('tt-released').textContent = node.dataset.released;
        document.getElementById('tt-label').textContent = node.dataset.label;

        const tieupContainer = document.getElementById('tt-tieup-container');
        if (node.dataset.tieup) {
            document.getElementById('tt-tieup').textContent = node.dataset.tieup;
            tieupContainer.style.display = 'flex'; 
        } else {
            tieupContainer.style.display = 'none';
        }
    }

    /* MAGNETIC TOOLTIP POSITIONING */
    function updateMagneticTooltip() {
        const forcedNode = document.querySelector('.force-hover');
        /* PRIORITIZE HOVERED NODE OVER PINNED NODE */
        const currentNode = activeHoveredNode || forcedNode;

        if (currentNode) {
            const t = pz.getTransform();
            const dragRect = dragContainer.getBoundingClientRect();
            const oRect = borderOuter.getBoundingClientRect();
            const dl = dragRect.left - oRect.left;
            const dt = dragRect.top - oRect.top;

            const local = getLocalCoords(currentNode, zoomTarget);
            let targetLeft = (local.x + currentNode.offsetWidth) * t.scale + t.x + dl + 20;
            let targetTop = local.y * t.scale + t.y + dt - 15;

            if (targetLeft < 15) targetLeft = 15;
            if (targetTop < 15) targetTop = 15;

            tooltip.style.left = targetLeft + 'px';
            tooltip.style.top = targetTop + 'px';
            tooltip.style.display = 'block';
        } else {
            tooltip.style.display = 'none'; 
        }
    }
    
    pz.on('pan', updateMagneticTooltip);
    pz.on('zoom', updateMagneticTooltip);
    
    /* SEARCH & FILTER ENGINE */
    const searchInput = document.getElementById('tl-search-box');
    const searchDropdown = document.getElementById('tl-search-dropdown');
    const filterBtns = document.querySelectorAll('.tl-filter-btn');
    const searchClearBtn = document.getElementById('tl-search-clear');

    /* EXECUTE SEARCH */
    function runSearch() {
        const keyword = searchInput.value.toLowerCase().trim();
        const allMusicNodes = document.querySelectorAll('.tl-node[data-title]');
        const activeFilterBtn = document.querySelector('.tl-filter-btn.active');
        const currentFilter = activeFilterBtn ? activeFilterBtn.dataset.filter : 'all';

        searchDropdown.innerHTML = '';
        searchClearBtn.style.display = keyword.length > 0 ? 'block' : 'none';

        allMusicNodes.forEach(node => node.classList.remove('is-searched'));

        if (keyword.length < 2) {
            searchDropdown.classList.remove('show');
            return;
        }

        let matchedNodes = [];
        allMusicNodes.forEach((node, index) => {
            const isMatchFilter = (currentFilter === 'all' || node.dataset.type === currentFilter);
            if (!isMatchFilter) return;

            const nodeData = ((node.dataset.title || '') + ' ' + (node.dataset.sub || '') + ' ' + (node.dataset.released || '') + ' ' + (node.dataset.label || '') + ' ' + (node.dataset.tieup || '')).toLowerCase();

            if (nodeData.includes(keyword)) {
                node.classList.add('is-searched');
                matchedNodes.push({ node, index });
            }
        });

        if (matchedNodes.length === 0) {
            searchDropdown.classList.remove('show');
        } else {
            /* RESET PINNED NODES */
            allMusicNodes.forEach(n => n.classList.remove('force-hover'));

            /* RENDER DROPDOWN ITEMS */
            let dropdownHTML = '';
            matchedNodes.forEach(match => {
                const node = match.node;
                const innerImg = node.querySelector('img');
                const imgSrc = innerImg ? innerImg.getAttribute('src') : '';
                dropdownHTML += `
                    <div class="tl-dropdown-item" data-index="${match.index}">
                        <div class="tl-di-left">
                            <img src="${imgSrc}" draggable="false">
                            <span>${node.dataset.sub}</span>
                        </div>
                        <div class="tl-di-right">${node.dataset.released}</div>
                    </div>
                `;
            });
            searchDropdown.innerHTML = dropdownHTML;
            searchDropdown.classList.add('show');

            /* AUTO-PIN FIRST MATCH */
            const firstNode = matchedNodes[0].node;
            firstNode.classList.add('force-hover');
            activeHoveredNode = firstNode;
            
            /* PAN & ZOOM TO MATCH */
            const cRect = dragContainer.getBoundingClientRect();
            const currentT = pz.getTransform();
            const r = firstNode.getBoundingClientRect();
            
            const nodeScreenX = r.left + r.width / 2;
            const nodeScreenY = r.top + r.height / 2;
            const localX = (nodeScreenX - cRect.left - currentT.x) / currentT.scale;
            const localY = (nodeScreenY - cRect.top - currentT.y) / currentT.scale;

            currentT.scale = 1;
            currentT.x = (cRect.width / 2) - localX;
            currentT.y = (cRect.height / 2) - localY;
            zoomTarget.style.transform = `matrix(1, 0, 0, 1, ${currentT.x}, ${currentT.y})`;

            updateTooltipContent(firstNode);
            updateMagneticTooltip();

            /* DROPDOWN ITEM SELECTION */
            searchDropdown.querySelectorAll('.tl-dropdown-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    const targetNode = allMusicNodes[this.getAttribute('data-index')];
                    allMusicNodes.forEach(n => n.classList.remove('force-hover'));
                    targetNode.classList.add('force-hover');
                    
                    const t = pz.getTransform();
                    const cr = dragContainer.getBoundingClientRect();
                    const nr = targetNode.getBoundingClientRect();
                    
                    const lx = (nr.left + nr.width / 2 - cr.left - t.x) / t.scale;
                    const ly = (nr.top + nr.height / 2 - cr.top - t.y) / t.scale;
                    
                    t.scale = 1;
                    t.x = (cr.width / 2) - lx;
                    t.y = (cr.height / 2) - ly;
                    zoomTarget.style.transform = `matrix(1, 0, 0, 1, ${t.x}, ${t.y})`;
                    
                    activeHoveredNode = targetNode;
                    updateTooltipContent(targetNode);
                    updateMagneticTooltip();

                    /* CLOSE DROPDOWN ON SELECT */
                    searchDropdown.classList.remove('show');
                });
            });
        }
    }

    searchInput.addEventListener('input', runSearch);

    /* FILTER BUTTON CLICK LISTENER */
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filterType = btn.dataset.filter;
            
            document.querySelectorAll('.tl-node[data-type]').forEach(node => {
                node.classList.toggle('is-filtered', filterType !== 'all' && node.dataset.type !== filterType);
            });
            
            /* CLEANUP GHOST TOOLTIPS ON TAB CHANGE */
            const currentPinnedNode = document.querySelector('.force-hover');
            if (currentPinnedNode && currentPinnedNode.classList.contains('is-filtered')) {
                currentPinnedNode.classList.remove('force-hover');
                tooltip.style.display = 'none';
                activeHoveredNode = null; 
            }
            
            runSearch();
            
            /* RECALCULATE TOOLTIP POSITION AFTER LAYOUT REFLOW */
            setTimeout(() => {
                if (document.querySelector('.force-hover') || activeHoveredNode) {
                    updateMagneticTooltip();
                }
            }, 10);
        });
    });

    /* SEARCH CLEAR BUTTON */
    searchClearBtn.addEventListener('click', () => {
        searchInput.value = ''; 
        runSearch(); 
        searchInput.focus(); 
    });

    /* GLOBAL EVENT HANDLERS (MOUSE & TOUCH) */
    document.querySelectorAll('.tl-node').forEach(node => {
        node.addEventListener('mouseenter', () => {
            /* PROTECT PINNED NODE WHILE DRAGGING MAP */
            if (isGlobalDragging) return; 
            
            document.querySelectorAll('.force-hover').forEach(n => n.classList.remove('force-hover'));
        });
        
        /* MOUSE DRAG DETECTION (PC) */
        let mouseStartX = 0;
        let mouseStartY = 0;

        node.addEventListener('mousedown', (e) => {
            mouseStartX = e.clientX;
            mouseStartY = e.clientY;
        });

        node.addEventListener('click', (e) => {
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (isTouch) {
                /* DELEGATE TO TOUCH EVENTS ON MOBILE */
                e.preventDefault(); 
                return;
            }

            /* CALCULATE DRAG DISTANCE */
            const distance = Math.sqrt(Math.pow(e.clientX - mouseStartX, 2) + Math.pow(e.clientY - mouseStartY, 2));
            
            if (distance > 1) {
                /* PREVENT CLICK IF DRAGGING */
                e.preventDefault();
                return; 
            }

            /* PIN NODE ON VALID CLICK */
            document.querySelectorAll('.force-hover').forEach(n => n.classList.remove('force-hover'));
            node.classList.add('force-hover');
        });

        /* TOUCH SWIPE DETECTION (MOBILE) */
        let touchStartX = 0;
        let touchStartY = 0;

        node.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});
        
        node.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const distance = Math.sqrt(Math.pow(touchEndX - touchStartX, 2) + Math.pow(touchEndY - touchStartY, 2));
            
            if (distance > 10) return; /* IGNORE CLICK ON SWIPE */
            
            if (e.cancelable) e.preventDefault();
            if (!node.hasAttribute('data-title')) return;
            
            if (!node.classList.contains('force-hover')) {
                /* FIRST TAP: PIN NODE AND SHOW TOOLTIP */
                document.querySelectorAll('.force-hover').forEach(n => n.classList.remove('force-hover'));
                node.classList.add('force-hover');
                activeHoveredNode = node;
                updateTooltipContent(node);
                updateMagneticTooltip();
            } else {
                /* SECOND TAP: NAVIGATE TO LINK */
                const link = node.getAttribute('href');
                if (link && link !== '#') {
                    window.location.href = link;
                }
            }
        });
    });

    /* WINDOW RESIZE HANDLER */
    window.addEventListener('resize', updateMagneticTooltip, { passive: true });

    /* CLOSE DROPDOWN ON OUTSIDE CLICK */
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.tl-search-inner')) {
            searchDropdown.classList.remove('show');
        }
    });

    /* HIDE TOOLTIP ON OUTSIDE TOUCH (MOBILE) */
    let globalTouchStartX = 0;
    let globalTouchStartY = 0;

    document.addEventListener('touchstart', (e) => {
        globalTouchStartX = e.changedTouches[0].screenX;
        globalTouchStartY = e.changedTouches[0].screenY;
    }, { capture: true, passive: true });

    document.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const distance = Math.sqrt(Math.pow(touchEndX - globalTouchStartX, 2) + Math.pow(touchEndY - globalTouchStartY, 2));

        if (distance > 10) return; /* ABORT ON SWIPE */

        const isSearch = e.target.closest('.tl-search-inner');
        const isFilter = e.target.closest('.tl-filter-group');
        const isNode = e.target.closest('.tl-node');
        const isTooltip = e.target.closest('.tl-global-tooltip');
        
        if (!isSearch) {
            /* CLOSE DROPDOWN ON BLUR */
            searchDropdown.classList.remove('show');
            document.getElementById('tl-search-box').blur();
        }

        if (!isSearch && !isFilter && !isNode && !isTooltip) {
            /* HIDE TOOLTIP IF TOUCHED BLANK SPACE */
            document.querySelectorAll('.force-hover').forEach(n => n.classList.remove('force-hover'));
            tooltip.style.display = 'none';
            activeHoveredNode = null;
        }
    }, { capture: true, passive: true });

    /* REOPEN DROPDOWN ON SEARCH FOCUS/CLICK */
    searchInput.addEventListener('click', () => {
        if (searchInput.value.trim().length >= 2 && searchDropdown.children.length > 0) {
            searchDropdown.classList.add('show');
        }
    });

    searchInput.addEventListener('focus', () => {
        if (searchInput.value.trim().length >= 2 && searchDropdown.children.length > 0) {
            searchDropdown.classList.add('show');
        }
    });
});
</script>
